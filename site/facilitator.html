<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الميسّرين | هاكثون السيرة النبوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --navy:#28323C; --navy-dark:#1B232B; --navy-light:#3A4754; --teal:#B8860B;
    --gold:#D9A400; --bg:#FEFAEC; --card:#FFFFFF; --ink:#1A1A2E; --muted:#6B7A99;
    --border:#E4E6EF; --border-light:#EEF0F5; --danger:#C0392B; --radius:14px;
  }
  body.dark{
    --bg:#161C22; --card:#1E262E; --ink:#EEF0F2; --muted:#8b96a8; --border:#2F3944; --border-light:#252E37;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink); transition:background .2s, color .2s;}
  .top-bar{background:rgba(253,252,250,.95); border-bottom:1px solid var(--border); padding:14px 20px; text-align:center;}
  body.dark .top-bar{background:rgba(21,31,48,.95) !important;}
  .top-bar img{height:44px; display:inline-block; vertical-align:middle;}
  .top-bar .divider{display:inline-block; width:1px; height:34px; background:var(--border); margin:0 16px; vertical-align:middle;}
  @media (max-width:600px){ .top-bar img{height:34px;} .top-bar .divider{height:26px;} }

  .auth-gate{max-width:400px; margin:16px auto 80px; text-align:center; background:var(--card); border-radius:var(--radius); padding:36px 28px; border:1px solid var(--border);}
  .auth-gate h2{margin-bottom:6px; color:var(--navy);}
  .auth-gate p{color:var(--muted); font-size:13.5px; margin-bottom:20px;}
  .field{margin-bottom:14px; text-align:right;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  input, select, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:9px; font-family:inherit;
    font-size:13.5px; background:var(--card); color:var(--ink);
  }
  body.dark input, body.dark select, body.dark textarea{ background:#1B232B !important; color:var(--ink) !important; border-color:var(--border) !important; }
  .btn{width:100%; padding:11px; border:none; border-radius:9px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}
  .btn-sm{width:auto; padding:7px 14px; font-size:12.5px;}
  .alert{font-size:12.5px; margin:8px 0; padding:0;}
  .alert.error{color:var(--danger);}
  .alert.success{color:var(--teal);}

  header{background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, #1B232B 100%); color:#fff; padding:22px 24px;}
  .header-row{display:flex; justify-content:space-between; align-items:center; max-width:900px; margin:0 auto; flex-wrap:wrap; gap:10px;}
  header h1{font-size:19px; margin:0;}
  header p{margin:2px 0 0; font-size:12.5px; color:#B7BEC6;}
  .btn-link{background:none; border:none; color:#c8d3e8; font-family:inherit; font-size:12.5px; cursor:pointer;}

  main{max-width:900px; margin:24px auto; padding:0 20px 60px;}
  .card{background:var(--card); border-radius:16px; border:1px solid var(--border-light); padding:22px; margin-bottom:16px; box-shadow:0 1px 3px rgba(13,27,62,.04);}
  .empty-state{text-align:center; padding:36px 20px; color:var(--muted); font-size:13.5px;}

  .filter-pills{display:flex; gap:6px; margin-bottom:16px;}
  .filter-pill{padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer;}
  .filter-pill.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .session-card{
    display:flex; align-items:center; gap:14px; padding:16px 18px; border:1px solid var(--border); border-radius:14px;
    margin-bottom:10px; cursor:pointer; transition:.15s; background:var(--card);
  }
  .session-card:hover{border-color:var(--navy); box-shadow:0 4px 14px rgba(13,27,62,.06);}
  .session-icon{width:42px; height:42px; border-radius:12px; background:var(--border-light); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .session-icon i{width:20px; height:20px; color:var(--gold);}
  .session-title{font-size:14px; font-weight:700; color:var(--ink);}
  .session-meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .session-count{font-size:11.5px; font-weight:700; color:var(--teal); background:#e6f7f3; padding:3px 10px; border-radius:12px; flex-shrink:0;}
  .today-flag{font-size:10px; font-weight:700; color:var(--gold); background:#fbf3e2; padding:2px 8px; border-radius:10px; margin-right:6px;}

  .back-link{display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--muted); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:0; margin-bottom:14px;}
  .back-link i{width:15px; height:15px;}

  .sub-tabs{display:flex; gap:4px; background:var(--border-light); padding:4px; border-radius:12px; margin-bottom:18px; max-width:320px;}
  .sub-tab{flex:1; padding:9px 14px; border:none; border-radius:9px; background:none; font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; text-align:center;}
  .sub-tab.active{background:var(--card); color:var(--navy); box-shadow:0 1px 4px rgba(0,0,0,.06);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:right; padding:9px 10px; color:var(--muted); font-size:11.5px; font-weight:700; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid var(--border-light);}

  #reader{width:100%; max-width:340px; margin:0 auto; border-radius:14px; overflow:hidden;}
  .result-flash{padding:12px 16px; border-radius:10px; text-align:center; font-weight:700; font-size:13.5px; margin-top:14px;}
  .result-flash.ok{background:#e6f7f3; color:var(--teal);}
  .result-flash.warn{background:#fef3e2; color:var(--gold);}
  .result-flash.err{background:#fdf5f4; color:var(--danger);}
  .log-item{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border-light); font-size:12.5px;}
</style>
<script src="config.js"></script>
</head>

        <p>تسجيل حضور جلسات التحضير — يدويًا أو عبر مسح QR</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button id="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع الداكن/الفاتح" style="background:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;width:32px;height:32px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><i data-lucide="moon" style="width:15px;height:15px"></i></button>
        <button class="btn-link" onclick="handleLogout()">تسجيل الخروج</button>
      </div>
    </div>
  </header>
  <main>
    <div id="main-view"></div>
  </main>
</div>

<script>
const SUPABASE_URL = window.SEERA_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.SEERA_CONFIG.SUPABASE_ANON_KEY;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentView = "sessions";
let currentSessionId = null;
let currentFilter = "today";
let cachedSessions = [];
let html5QrCode = null;

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(d){
  if(!d) return "";
  return new Date(d).toLocaleString('ar-SA', {weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
}
function isToday(dateStr){
  const d = new Date(dateStr), now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

function toggleTheme(){
  const isDark = document.body.classList.toggle("dark");
  document.getElementById("theme-toggle").innerHTML = isDark
    ? '<i data-lucide="sun" style="width:15px;height:15px"></i>'
    : '<i data-lucide="moon" style="width:15px;height:15px"></i>';
  if(window.lucide) lucide.createIcons();
  localStorage.setItem("seera-theme", isDark ? "dark" : "light");
}
if(localStorage.getItem("seera-theme") === "dark"){
  document.body.classList.add("dark");
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("theme-toggle");
    if(btn) btn.innerHTML = '<i data-lucide="sun" style="width:15px;height:15px"></i>';
  });
}

async function handleGateLogin(){
  const email = document.getElementById("gate-email").value.trim();
  const password = document.getElementById("gate-password").value;
  const alertBox = document.getElementById("gate-alert");
  alertBox.className = "alert";
  if(!email || !password){ alertBox.textContent = "أدخل البريد وكلمة المرور"; alertBox.className = "alert error"; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alertBox.textContent = "بيانات الدخول غير صحيحة"; alertBox.className = "alert error"; return; }

  currentUser = data.user;
  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", currentUser.id);
  const roleKeys = (roles||[]).map(r => r.roles?.key);
  if(!roleKeys.includes("facilitator") && !roleKeys.includes("admin") && !roleKeys.includes("coordinator")){
    await sb.auth.signOut();
    alertBox.textContent = "هذا الحساب لا يملك صلاحية التيسير";
    alertBox.className = "alert error";
    return;
  }

  const { data: profile } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).maybeSingle();
  document.getElementById("facilitator-welcome").textContent = "مرحبًا، " + (profile?.full_name || currentUser.email);
  document.getElementById("auth-gate-screen").style.display = "none";
  document.getElementById("content-screen").style.display = "block";
  if(window.lucide) lucide.createIcons();
  renderSessionsList();
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById("content-screen").style.display = "none";
  document.getElementById("auth-gate-screen").style.display = "block";
}
(async () => {
  const { data } = await sb.auth.getSession();
  if(data.session){
    currentUser = data.session.user;
    const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", currentUser.id);
    const roleKeys = (roles||[]).map(r => r.roles?.key);
    if(roleKeys.includes("facilitator") || roleKeys.includes("admin") || roleKeys.includes("coordinator")){
      const { data: profile } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).maybeSingle();
      document.getElementById("facilitator-welcome").textContent = "مرحبًا، " + (profile?.full_name || currentUser.email);
      document.getElementById("auth-gate-screen").style.display = "none";
      document.getElementById("content-screen").style.display = "block";
      if(window.lucide) lucide.createIcons();
      renderSessionsList();
    }
  }
})();

/* ---------------- مبدّل العرض الرئيسي ---------------- */
let mainMode = "sessions"; // sessions | matrix
function mainModeSwitcherHtml(){
  return `<div class="sub-tabs" style="max-width:360px;margin-bottom:18px">
    <button class="sub-tab ${mainMode==='sessions'?'active':''}" onclick="switchMainMode('sessions')">الجلسات</button>
    <button class="sub-tab ${mainMode==='matrix'?'active':''}" onclick="switchMainMode('matrix')">الحضور الشامل</button>
  </div>`;
}
function switchMainMode(mode){
  mainMode = mode;
  if(mode === "sessions") renderSessionsList();
  else renderAttendanceMatrix();
}

/* ---------------- قائمة الجلسات ---------------- */
async function renderSessionsList(){
  currentView = "sessions";
  const box = document.getElementById("main-view");
  box.innerHTML = mainModeSwitcherHtml() + `
    <div class="filter-pills">
      <button class="filter-pill ${currentFilter==='today'?'active':''}" onclick="setFilter('today')">اليوم</button>
      <button class="filter-pill ${currentFilter==='upcoming'?'active':''}" onclick="setFilter('upcoming')">القادمة</button>
      <button class="filter-pill ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">كل الجلسات</button>
    </div>
    <div id="sessions-container"><div class="empty-state">جاري التحميل...</div></div>
  `;

  const { data, error } = await sb.from("prep_sessions")
    .select("*, prep_attendance(count)")
    .order("session_date");

  const container = document.getElementById("sessions-container");
  if(error){ container.innerHTML = `<div class="empty-state">خطأ: ${esc(error.message)}</div>`; return; }
  cachedSessions = data || [];
  renderFilteredSessions();
}
function setFilter(f){
  currentFilter = f;
  renderSessionsList();
}
function renderFilteredSessions(){
  const now = new Date();
  let filtered = cachedSessions;
  if(currentFilter === "today") filtered = cachedSessions.filter(s => isToday(s.session_date));
  else if(currentFilter === "upcoming") filtered = cachedSessions.filter(s => new Date(s.session_date) >= now);

  const container = document.getElementById("sessions-container");
  if(!filtered.length){
    container.innerHTML = `<div class="card"><div class="empty-state">
      <i data-lucide="calendar-x" style="width:32px;height:32px;color:var(--muted);margin-bottom:10px"></i><br>
      ${currentFilter==='today' ? 'لا توجد جلسات مجدولة اليوم' : 'لا توجد جلسات مطابقة'}
    </div></div>`;
    if(window.lucide) lucide.createIcons();
    return;
  }
  container.innerHTML = filtered.map(s => `
    <div class="session-card" onclick="openSessionDetail('${s.id}')">
      <div class="session-icon"><i data-lucide="${s.session_type === 'event' ? 'map-pin' : 'graduation-cap'}"></i></div>
      <div style="flex:1">
        <div class="session-title">${isToday(s.session_date) ? '<span class="today-flag">اليوم</span>' : ''}${s.session_type === 'event' ? '<span class="today-flag" style="background:#e6f0fb;color:var(--navy)">فعالية</span> ' : ''}${esc(s.title)}</div>
        <div class="session-meta">${fmtDate(s.session_date)}${s.location ? ' · ' + esc(s.location) : ''}</div>
      </div>
      <span class="session-count">${s.prep_attendance?.[0]?.count ?? 0} حاضر</span>
    </div>
  `).join("");
  if(window.lucide) lucide.createIcons();
}

/* ---------------- الحضور الشامل: جدول مصفوفي (مشاركون × جلسات) ---------------- */
let matrixTrackFilter = "";
let matrixSessions = [];
let matrixParticipants = [];
let matrixAttendanceMap = {}; // key: `${sessionId}|${userId}` => true

async function renderAttendanceMatrix(){
  currentView = "matrix";
  const box = document.getElementById("main-view");
  box.innerHTML = mainModeSwitcherHtml() + `
    <div class="card" style="padding:14px 16px;margin-bottom:14px">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input id="matrix-search" placeholder="بحث بالاسم أو البريد..." style="flex:1;min-width:180px" oninput="renderMatrixTable()">
        <select id="matrix-track-filter" style="max-width:220px" onchange="loadAttendanceMatrix()"><option value="">كل المسارات</option></select>
      </div>
    </div>
    <div class="card" style="overflow-x:auto">
      <div id="matrix-container"><div class="empty-state">جاري التحميل...</div></div>
    </div>
  `;

  const { data: tracks } = await sb.from("tracks").select("id,name_ar").eq("is_active", true);
  const trackSelect = document.getElementById("matrix-track-filter");
  (tracks||[]).forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.id; opt.textContent = t.name_ar;
    trackSelect.appendChild(opt);
  });

  await loadAttendanceMatrix();
}
async function loadAttendanceMatrix(){
  matrixTrackFilter = document.getElementById("matrix-track-filter")?.value || "";
  const container = document.getElementById("matrix-container");
  container.innerHTML = `<div class="empty-state">جاري التحميل...</div>`;

  let sessionsQuery = sb.from("prep_sessions").select("id,title,session_date,track_id").order("session_date");
  const { data: sessions } = await sessionsQuery;
  matrixSessions = matrixTrackFilter
    ? (sessions||[]).filter(s => !s.track_id || s.track_id === matrixTrackFilter)
    : (sessions||[]);

  let membersQuery = sb.from("team_members")
    .select("user_id, profiles(full_name, email, phone), teams!inner(status, track_id, tracks(name_ar))")
    .eq("teams.status", "confirmed");
  if(matrixTrackFilter) membersQuery = membersQuery.eq("teams.track_id", matrixTrackFilter);
  const { data: members } = await membersQuery;
  matrixParticipants = members || [];

  const sessionIds = matrixSessions.map(s => s.id);
  matrixAttendanceMap = {};
  if(sessionIds.length){
    const { data: attendance } = await sb.from("prep_attendance").select("session_id,user_id").in("session_id", sessionIds);
    (attendance||[]).forEach(a => { matrixAttendanceMap[`${a.session_id}|${a.user_id}`] = true; });
  }
  renderMatrixTable();
}
function renderMatrixTable(){
  const container = document.getElementById("matrix-container");
  if(!matrixParticipants.length){ container.innerHTML = `<div class="empty-state">لا يوجد مشاركون مؤهّلون</div>`; return; }
  if(!matrixSessions.length){ container.innerHTML = `<div class="empty-state">لا توجد جلسات مضافة بعد لهذا المسار</div>`; return; }

  const term = (document.getElementById("matrix-search")?.value || "").trim().toLowerCase();
  const filtered = !term ? matrixParticipants : matrixParticipants.filter(m =>
    (m.profiles?.full_name||"").toLowerCase().includes(term) || (m.profiles?.email||"").toLowerCase().includes(term)
  );

  container.innerHTML = `<table style="min-width:${560 + matrixSessions.length*60}px">
    <thead><tr>
      <th style="width:36px">#</th>
      <th>الاسم</th>
      <th>الجوال</th>
      <th>المسار</th>
      ${matrixSessions.map((s,i) => `<th style="text-align:center" title="${esc(s.title)} — ${fmtDate(s.session_date)}">${i+1}</th>`).join("")}
    </tr></thead>
    <tbody>
      ${filtered.map((m, idx) => `
        <tr>
          <td style="color:var(--muted)">${idx+1}</td>
          <td><strong>${esc(m.profiles?.full_name||"—")}</strong><br><span style="color:var(--muted);font-size:11px">${esc(m.profiles?.email||"")}</span></td>
          <td style="font-size:12px;color:var(--muted)">${esc(m.profiles?.phone||"—")}</td>
          <td style="font-size:12px;color:var(--muted)">${esc(m.teams?.tracks?.name_ar||"—")}</td>
          ${matrixSessions.map(s => {
            const key = `${s.id}|${m.user_id}`;
            const present = !!matrixAttendanceMap[key];
            return `<td style="text-align:center">
              <button onclick="toggleMatrixCell('${s.id}','${m.user_id}')"
                style="width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;font-weight:800;font-size:14px;
                background:${present ? '#e6f7f3' : '#fdf5f4'};color:${present ? 'var(--teal)' : 'var(--danger)'}">
                ${present ? '✓' : '✗'}
              </button>
            </td>`;
          }).join("")}
        </tr>
      `).join("")}
    </tbody>
  </table>`;
}
async function toggleMatrixCell(sessionId, userId){
  const key = `${sessionId}|${userId}`;
  const isPresent = !!matrixAttendanceMap[key];
  if(isPresent){
    const { error } = await sb.from("prep_attendance").delete().eq("session_id", sessionId).eq("user_id", userId);
    if(error){ alert("خطأ: " + error.message); return; }
    delete matrixAttendanceMap[key];
  } else {
    const { error } = await sb.from("prep_attendance").insert({ session_id: sessionId, user_id: userId });
    if(error){ alert("خطأ: " + error.message); return; }
    matrixAttendanceMap[key] = true;
  }
  renderMatrixTable();
}

/* ---------------- تفاصيل جلسة: يدوي + QR ---------------- */
let sessionSubTab = "manual";
let prepParticipantsCache = [];
let prepPresentIds = new Set();

async function openSessionDetail(sessionId){
  currentView = "detail";
  currentSessionId = sessionId;
  sessionSubTab = "manual";
  const session = cachedSessions.find(s => s.id === sessionId);

  const box = document.getElementById("main-view");
  box.innerHTML = `
    <button class="back-link" onclick="renderSessionsList()"><i data-lucide="arrow-right"></i> كل الجلسات</button>
    <div class="card" style="margin-bottom:16px">
      <h2 style="margin:0 0 4px">${esc(session?.title||"")}</h2>
      <p style="color:var(--muted);font-size:13px;margin:0">${fmtDate(session?.session_date)}${session?.location ? ' · ' + esc(session.location) : ''}</p>
    </div>
    <div class="sub-tabs">
      <button class="sub-tab active" id="tab-manual" onclick="switchSessionSubTab('manual')">الحضور اليدوي</button>
      <button class="sub-tab" id="tab-qr" onclick="switchSessionSubTab('qr')">مسح QR</button>
    </div>
    <div id="sub-tab-body"><div class="card"><div class="empty-state">جاري التحميل...</div></div></div>
  `;
  if(window.lucide) lucide.createIcons();
  await loadManualAttendance(sessionId, session?.track_id);
}
function switchSessionSubTab(tab){
  sessionSubTab = tab;
  document.getElementById("tab-manual").classList.toggle("active", tab==="manual");
  document.getElementById("tab-qr").classList.toggle("active", tab==="qr");
  if(html5QrCode){ html5QrCode.stop().catch(()=>{}); html5QrCode = null; }
  if(tab === "manual") renderManualAttendanceBody();
  else renderQrScanBody();
}

async function loadManualAttendance(sessionId, trackId){
  let query = sb.from("team_members")
    .select("user_id, profiles(full_name, email), teams!inner(status, track_id, team_name, team_code)")
    .eq("teams.status", "confirmed");
  if(trackId) query = query.eq("teams.track_id", trackId);
  const { data: members } = await query;

  const { data: attendance } = await sb.from("prep_attendance").select("user_id").eq("session_id", sessionId);
  prepParticipantsCache = members || [];
  prepPresentIds = new Set((attendance||[]).map(a => a.user_id));
  renderManualAttendanceBody();
}
function renderManualAttendanceBody(){
  const box = document.getElementById("sub-tab-body");
  box.innerHTML = `<div class="card">
    <div class="field"><input id="prep-search" placeholder="بحث بالاسم أو البريد..." oninput="filterManualAttendance()"></div>
    <div id="manual-attendance-table"></div>
  </div>`;
  filterManualAttendance();
}
function filterManualAttendance(){
  const term = (document.getElementById("prep-search")?.value || "").trim().toLowerCase();
  const filtered = !term ? prepParticipantsCache : prepParticipantsCache.filter(m =>
    (m.profiles?.full_name||"").toLowerCase().includes(term) || (m.profiles?.email||"").toLowerCase().includes(term)
  );
  const box = document.getElementById("manual-attendance-table");
  if(!box) return;
  if(!filtered.length){ box.innerHTML = `<div class="empty-state">لا يوجد مشاركون مؤهّلون</div>`; return; }
  box.innerHTML = `<table><thead><tr><th>الاسم</th><th>الفريق</th><th>الحضور</th></tr></thead><tbody>
    ${filtered.map(m => {
      const present = prepPresentIds.has(m.user_id);
      return `<tr>
        <td>${esc(m.profiles?.full_name||"—")}<br><span style="color:var(--muted);font-size:11.5px">${esc(m.profiles?.email||"")}</span></td>
        <td>${esc(m.teams?.team_name||"")} <code style="font-size:10px;color:var(--gold)">${esc(m.teams?.team_code||"")}</code></td>
        <td><button class="btn btn-sm ${present?'btn-primary':'btn-outline'}" onclick="toggleManualAttendance('${m.user_id}', ${present})">${present?'✓ حاضر':'تسجيل حضور'}</button></td>
      </tr>`;
    }).join("")}
    </tbody></table>`;
}
async function toggleManualAttendance(userId, isPresent){
  if(isPresent){
    const { error } = await sb.from("prep_attendance").delete().eq("session_id", currentSessionId).eq("user_id", userId);
    if(error){ alert("خطأ: " + error.message); return; }
    prepPresentIds.delete(userId);
  } else {
    const { error } = await sb.from("prep_attendance").insert({ session_id: currentSessionId, user_id: userId });
    if(error){ alert("خطأ: " + error.message); return; }
    prepPresentIds.add(userId);
  }
  filterManualAttendance();
}

/* ---------------- مسح QR ---------------- */
let scanLog = [];
function renderQrScanBody(){
  const box = document.getElementById("sub-tab-body");
  box.innerHTML = `<div class="card" style="text-align:center">
    <div id="reader"></div>
    <div id="scan-result"></div>
    <h4 style="font-size:13px;margin:18px 0 8px;text-align:right">آخر عمليات المسح</h4>
    <div id="scan-log" style="text-align:right"></div>
  </div>`;
  scanLog = [];
  renderScanLog();
  startScanner();
}
function startScanner(){
  html5QrCode = new Html5Qrcode("reader");
  Html5Qrcode.getCameras().then(cameras => {
    if(!cameras.length) return;
    const cameraId = cameras[cameras.length - 1].id;
    html5QrCode.start(cameraId, { fps: 10, qrbox: 220 }, onScanSuccess, () => {});
  }).catch(() => {
    document.getElementById("scan-result").innerHTML = `<div class="result-flash err">تعذّر الوصول للكاميرا — تأكد من إعطاء الإذن</div>`;
  });
}
let lastScanTime = 0;
async function onScanSuccess(decodedText){
  const now = Date.now();
  if(now - lastScanTime < 2000) return;
  lastScanTime = now;

  const resultBox = document.getElementById("scan-result");
  if(!decodedText.startsWith("SEERA-USER:")){
    resultBox.innerHTML = `<div class="result-flash err">رمز غير صالح</div>`;
    return;
  }
  const userId = decodedText.replace("SEERA-USER:", "").trim();
  const { data, error } = await sb.rpc("record_attendance", { p_session_id: currentSessionId, p_user_id: userId });

  if(error || !data.success){
    resultBox.innerHTML = `<div class="result-flash err">${esc(data?.error || error?.message || "خطأ غير متوقع")}</div>`;
    return;
  }
  if(data.already_checked_in){
    resultBox.innerHTML = `<div class="result-flash warn">⚠ ${esc(data.name)} — مسجّل حضوره مسبقًا</div>`;
  } else {
    resultBox.innerHTML = `<div class="result-flash ok">✅ تم تسجيل حضور ${esc(data.name)}</div>`;
    prepPresentIds.add(userId);
  }
  scanLog.unshift({ name: data.name, time: new Date().toLocaleTimeString('ar-SA'), already: data.already_checked_in });
  renderScanLog();
}
function renderScanLog(){
  const box = document.getElementById("scan-log");
  if(!box) return;
  if(!scanLog.length){ box.innerHTML = `<span style="color:var(--muted);font-size:12.5px">لا يوجد تسجيلات بعد بهذه الجلسة</span>`; return; }
  box.innerHTML = scanLog.slice(0,15).map(l => `<div class="log-item"><span>${esc(l.name)}${l.already?' (مسبق)':''}</span><span style="color:var(--muted)">${l.time}</span></div>`).join("");
}
</script>
<div style="position:fixed;bottom:6px;left:8px;font-size:9.5px;color:#94a3b8;opacity:.5;font-family:monospace;z-index:9999;pointer-events:none">build: seera-r1</div>
</body>

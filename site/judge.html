<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكيم | هاكثون السيرة النبوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="cert.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --navy:#28323C; --navy-dark:#1B232B; --navy-light:#3A4754; --purple:#A67C00; --teal:#B8860B;
    --gold:#D9A400; --bg:#FEFAEC; --card:#FFFFFF; --ink:#1A1A2E; --muted:#6B7A99;
    --border:#E4E6EF; --border-light:#EEF0F5; --danger:#C0392B; --radius:14px;
  }
  body.dark{
    --bg:#161C22; --card:#1E262E; --ink:#EEF0F2; --muted:#8b96a8; --border:#2F3944; --border-light:#252E37;
  }
  body.dark .stat-card, body.dark .card{ color:var(--ink); }
  /* كل المشاريع */
  .ap-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .ap-card{margin-bottom:12px}
  .ap-head{display:flex;align-items:flex-start;gap:12px}
  .ap-title{font-size:15.5px;font-weight:700;color:var(--navy)}
  .ap-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .ap-meta code{font-size:10.5px;color:var(--gold);background:#FBF3E2;
    padding:2px 8px;border-radius:6px;margin-left:7px;margin-inline-end:7px}
  .ap-fold{margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}
  .ap-fold summary{cursor:pointer;list-style:none;display:block;padding:2px 0}
  .ap-fold summary::-webkit-details-marker{display:none}
  .ap-row{display:flex;align-items:center;gap:7px;font-size:12.5px;
    font-weight:600;color:var(--navy)}
  .ap-row i,.ap-row svg{width:14px;height:14px;color:var(--teal);flex-shrink:0;
    margin-left:7px;margin-inline-end:7px}
  .ap-row>span:first-of-type{flex:1;min-width:0}
  .ap-more{font-size:11px;color:var(--teal);background:rgba(217,164,0,.1);
    padding:2px 10px;border-radius:6px;font-weight:600;white-space:nowrap}
  .ap-fold[open] .ap-more{visibility:hidden}
  .ap-body{margin-top:9px;font-size:12.5px;line-height:1.85;color:var(--ink);
    white-space:pre-line;overflow-wrap:break-word;word-break:break-word}
  .ap-file{display:inline-flex;align-items:center;gap:7px;margin-top:11px;
    font-size:12.5px;color:var(--teal);text-decoration:none;font-weight:600}
  .ap-file i,.ap-file svg{width:14px;height:14px;margin-left:7px;margin-inline-end:7px}
  .ap-file:hover{text-decoration:underline}

  /* بطاقة اللجنة */
  .com-card{margin-bottom:16px;border-right:3px solid var(--teal)}
  .cc-head{display:flex;align-items:center;margin-bottom:12px}
  .cc-head i,.cc-head svg{width:22px;height:22px;color:var(--teal);flex-shrink:0;
    margin-left:12px;margin-inline-end:12px}
  .cc-title{font-size:16px;font-weight:700;color:var(--navy)}
  .cc-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .cc-desc{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.7}
  .cc-members{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
  .cc-member{display:flex;align-items:center;background:var(--bg,#F7F9FB);
    border:1px solid var(--border);border-radius:11px;padding:10px 12px}
  .cc-member.me{background:rgba(217,164,0,.08);border-color:rgba(217,164,0,.3)}
  .cc-ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--teal);color:#28323C;font-weight:800;font-size:14px;
    margin-left:10px;margin-inline-end:10px}
  .cc-info{display:flex;flex-direction:column;min-width:0}
  .cc-name{font-size:13.5px;font-weight:600;color:var(--navy)}
  .cc-spec{font-size:11.5px;color:var(--muted);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cc-tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;
    background:rgba(217,164,0,.16);color:#8A6A1E;margin-right:6px;margin-inline-start:6px}
  .cc-tag.me{background:rgba(217,164,0,.18);color:#8A6A00}

  body.dark input, body.dark select, body.dark textarea{
    background:#1B232B !important; color:var(--ink) !important; border-color:var(--border) !important;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink);}

  header{background:linear-gradient(135deg,#28323C 0%,#3A4754 58%,#00304F 100%); color:#fff; padding:18px 24px;}
  .hdr-brand{display:flex; align-items:center; margin-bottom:14px;}
  .hdr-brand img{height:26px; width:auto; flex-shrink:0; display:block; object-fit:contain;}
  .hdr-brand .sep{width:1px; height:20px; flex-shrink:0; margin:0 18px; background:rgba(255,255,255,.28);}
  .hdr-mark{width:46px; height:46px; border-radius:10px; overflow:hidden; flex-shrink:0; margin-left:14px; margin-inline-end:14px;
            box-shadow:0 0 26px rgba(217,164,0,.3);}
  .hdr-mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .hdr-title{display:flex; align-items:center;}
  @media (max-width:640px){
    .hdr-brand img{height:22px} .hdr-brand .sep{margin:0 12px}
    .hdr-mark{width:38px;height:38px;margin-left:10px;margin-inline-end:10px}
  }
  .header-row{max-width:900px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  header h1{font-size:18px; margin:0;}
  header p{margin:2px 0 0; font-size:12.5px; color:#a9b8d4;}
  .btn-link{background:none; border:none; color:#c8d3e8; cursor:pointer; font-size:12.5px; font-family:inherit;}

  main{max-width:900px; margin:0 auto; padding:24px;}
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:22px; margin-bottom:18px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--muted); font-size:14px;}

  .field{margin-bottom:14px;}
  /* تبويبات شاشة الدخول والتقديم */
  .switcher{display:flex;gap:4px;background:var(--bg,#FEFAEC);padding:4px;border-radius:11px;margin-bottom:16px}
  .switcher button{flex:1;padding:9px 12px;border:0;border-radius:8px;background:transparent;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.18s}
  .switcher button.active{background:#fff;color:var(--navy,#28323C);box-shadow:0 1px 4px rgba(40,50,60,.1)}
  body.dark .switcher{background:rgba(255,255,255,.06)}
  body.dark .switcher button.active{background:rgba(255,255,255,.14);color:#fff}
  .auth-gate textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;
    font-family:inherit;font-size:13.5px;resize:vertical}

  .field label{display:block; font-size:13px; margin-bottom:6px; font-weight:500;}
  .field input, .field textarea, .field select{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px;}
  .btn{border:none; border-radius:9px; padding:12px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--teal); color:#fff; width:100%;}
  .btn-primary:hover{background:#188878;}
  .alert{padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none;}
  .alert.error{background:#fdeceb; color:var(--danger); display:block;}
  .alert.success{background:#e6f7f3; color:var(--teal); display:block;}

  .auth-gate{max-width:400px; margin:20px auto 80px; text-align:center; background:var(--card); border-radius:var(--radius); padding:36px 28px; border:1px solid var(--border);}
  .auth-gate h2{margin-bottom:6px; color:var(--navy);}
  .auth-gate p{color:var(--muted); font-size:13.5px; margin-bottom:20px;}

  .team-header{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:14px;}
  .team-header h3{margin:0 0 3px; font-size:16.5px;}
  .team-header .sub{color:var(--muted); font-size:12.5px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge-gray{background:#f0f1f5; color:var(--muted);}
  .badge-green{background:#e6f7f3; color:var(--teal);}
  .badge-red{background:#fdeceb; color:var(--danger);}

  .project-box{background:#f8f9fb; border-radius:10px; padding:14px 16px; margin-bottom:16px;}
  .project-box h4{margin:0 0 4px; font-size:13.5px;}
  .project-box p{margin:0; font-size:13px; color:var(--muted); line-height:1.6;}

  /* ---------------- بطاقة المشروع المحسّنة ---------------- */
  .project-card{
    background:linear-gradient(180deg,#fff,#fbfbfd); border:1px solid var(--border-light); border-radius:14px;
    padding:18px 20px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  body.dark .project-card{ background:linear-gradient(180deg,var(--card),var(--card)); }
  .project-card::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--gold);}
  .project-card-head{display:flex; align-items:flex-start; gap:12px; margin-bottom:10px;}
  .project-card-icon{width:38px;height:38px;border-radius:10px;background:#fbf3e2;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .project-card-icon i, .project-card-icon svg{width:18px;height:18px;color:var(--gold);}
  .project-card-title{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 2px;}
  .project-card-meta{font-size:11.5px;color:var(--muted);}
  .project-card-desc{font-size:13.5px;color:var(--ink);line-height:1.75;margin:12px 0;padding-top:12px;border-top:1px solid var(--border-light);}
  /* طيّ وصف المشروع — يطول ويدفع نموذج التقييم للأسفل */
  .pd-fold{margin:10px 0 0;border-top:1px solid var(--border);padding-top:10px}
  .pd-fold summary{cursor:pointer;list-style:none;display:block;padding:2px 0}
  .pd-fold summary::-webkit-details-marker{display:none}
  .pd-row{display:flex;align-items:center;gap:7px;font-size:12.5px;
    font-weight:600;color:var(--navy)}
  .pd-row i,.pd-row svg{width:14px;height:14px;color:var(--teal);flex-shrink:0;
    margin-left:7px;margin-inline-end:7px}
  .pd-row>span:first-of-type{flex:1;min-width:0}
  .pd-more{font-size:11px;color:var(--teal);background:rgba(217,164,0,.1);
    padding:2px 10px;border-radius:6px;font-weight:600}
  .pd-fold[open] .pd-more{visibility:hidden}
  .pd-body{margin-top:9px;font-size:12.5px;line-height:1.85;color:var(--ink);
    overflow-wrap:break-word;word-break:break-word;max-width:100%}
  .pd-empty{font-size:12px;color:var(--muted);margin:10px 0 0}
  /* دليل المعايير — ثابت أعلى الصفحة بدل التكرار في كل بطاقة */
  .crit-guide{background:#fff;border:1px solid var(--border);border-radius:13px;
    padding:13px 16px;margin-bottom:14px}
  body.dark .crit-guide{background:rgba(255,255,255,.04)}
  .crit-guide summary{cursor:pointer;list-style:none;display:block}
  .crit-guide summary::-webkit-details-marker{display:none}
  .cg-row{display:flex;align-items:center;gap:9px}
  .cg-row i,.cg-row svg{width:17px;height:17px;color:var(--teal);flex-shrink:0;
    margin-left:9px;margin-inline-end:9px}
  .cg-title{font-size:14px;font-weight:700;color:var(--navy)}
  .cg-count{flex:1;font-size:12px;color:var(--muted);margin-right:8px;margin-inline-start:8px}
  .cg-more{font-size:11.5px;color:var(--teal);background:rgba(217,164,0,.1);
    padding:3px 11px;border-radius:7px;font-weight:600;white-space:nowrap}
  .crit-guide[open] .cg-more{visibility:hidden}
  .cg-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .cg-item{padding:10px 0;border-bottom:1px solid var(--border);max-width:100%}
  .cg-item:last-child{border-bottom:0;padding-bottom:0}
  .cg-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    flex-wrap:wrap}
  .cg-name{font-size:13.5px;font-weight:600;color:var(--navy);min-width:0}
  .cg-w{font-size:11.5px;color:var(--gold);font-weight:600;white-space:nowrap}
  .cg-desc{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:5px;
    overflow-wrap:break-word;word-break:break-word;max-width:100%}
  .cg-item{max-width:100%;overflow:hidden}


  .project-card-file{display:inline-flex;align-items:center;gap:6px;background:#e6f7f3;color:var(--teal);font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:20px;text-decoration:none;}

  /* ---------------- أزرار الدرجات (1 إلى الأقصى) ---------------- */
  /* nowrap لضمان صف أفقي واحد دائمًا؛ عمود الشبكة أدناه يتّسع لها */
  .score-scale{display:flex; gap:6px; flex-wrap:nowrap; justify-content:flex-start;}
  .score-btn{
    width:42px; height:42px; border-radius:10px; border:1.5px solid var(--border); background:#fff;
    font-family:inherit; font-size:14.5px; font-weight:700; color:var(--muted); cursor:pointer; transition:.15s; flex-shrink:0;
  }
  .score-btn:hover{border-color:var(--gold);}
  .score-btn.selected{background:var(--navy); border-color:var(--navy); color:#fff; transform:scale(1.06);}
  body.dark .score-btn{background:#1B232B;}

  /* ---------------- شريط المجموع الحي ---------------- */
  .live-total-bar{
    display:flex; justify-content:space-between; align-items:center; background:linear-gradient(135deg,var(--navy),var(--navy-light));
    color:#fff; border-radius:12px; padding:14px 18px; margin:16px 0; position:sticky; bottom:10px; z-index:5;
    box-shadow:0 8px 24px rgba(13,27,62,.25);
  }
  .live-total-bar .lbl{font-size:12.5px; color:#c8d3e8;}
  .live-total-bar .val{font-size:22px; font-weight:800; color:var(--gold);}
  .live-total-bar .val small{font-size:13px; color:#c8d3e8; font-weight:500;}

  /* ---------------- نافذة تأكيد الإرسال ---------------- */
  .confirm-overlay{position:fixed; inset:0; background:rgba(13,27,62,.7); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .confirm-box{background:var(--card); border-radius:16px; padding:26px; max-width:440px; width:100%; max-height:85vh; overflow-y:auto;}
  .confirm-box h3{margin:0 0 4px;}
  .confirm-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-light); font-size:13.5px;}
  .confirm-total-row{display:flex; justify-content:space-between; padding:14px 0 4px; font-size:15px; font-weight:800; color:var(--navy);}
  body.dark .confirm-total-row{ color:var(--gold); }

  /* عمود الدرجات: كان ثابتًا على 90px، وهو أضيق من 5 أزرار (234px)
     فكانت الأزرار تلتفّ وتظهر كشبكة بدل صف أفقي. auto يتّسع لها. */
  .criteria-row{display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);}
  .criteria-row:last-of-type{border-bottom:none;}
  .criteria-row .c-name{font-size:13.5px;}
  .criteria-row .c-hint{font-size:11.5px; color:var(--muted);}
  .criteria-row input{width:100%; padding:9px; border:1px solid var(--border); border-radius:8px; text-align:center; font-family:inherit;}

  /* ---------------- شريط الفلترة ---------------- */
  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .filter-chip{
    padding:9px 16px; border-radius:22px; border:1.5px solid var(--border); background:#fff;
    font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:.15s;
  }
  .filter-chip:hover{border-color:var(--gold);}
  .filter-chip.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  body.dark .filter-chip{background:#1B232B;}

  /* ---------------- بطاقة قابلة للطي ---------------- */
  .team-acc{margin-bottom:12px;}

  .team-acc > summary{
    list-style:none; cursor:pointer; padding:14px 18px; border-radius:12px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .team-acc > summary::-webkit-details-marker{display:none;}
  .team-acc > summary:hover{border-color:var(--gold);}
  .team-acc[open] > summary{border-bottom-left-radius:0; border-bottom-right-radius:0;}
  .acc-chevron{margin-inline-start:auto; transition:.2s; color:var(--muted); flex-shrink:0;}
  .team-acc[open] .acc-chevron{transform:rotate(180deg);}
  .acc-body{border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; padding:18px 20px; background:var(--card);}

  /* ---------------- الجوال ---------------- */
  @media (max-width: 700px){
    /* على الشاشات الضيقة نضع المعيار فوق والأزرار تحته بعرض كامل */
    .criteria-row{grid-template-columns:1fr; gap:10px;}
    .score-scale{justify-content:space-between;}
    .score-btn{width:100%; max-width:52px;}
    .team-acc > summary{padding:12px 14px;}
    .acc-body{padding:14px;}
  }

  /* كان مستخدمًا بتبويب الشهادات لكنه غير معرَّف بهذه الصفحة،
     فكان الصف يظهر بلا تنسيق ويتكدّس عناصره */
  .member-row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--border);}
  .member-row:last-child{border-bottom:none;}
  /* ===== التحكيم بنمط حاضنة ابتكار 5 ===== */
  .badge-gold{background:#fbf3e2; color:#92600a;}
  .btn-outline{background:none; border:1px solid var(--border); color:var(--ink);}
  .btn-outline:hover{border-color:var(--gold);}
  .hint{font-size:12.5px; color:var(--muted);}
  .jd-progress .jd-bar{height:8px; background:var(--border-light); border-radius:99px; overflow:hidden; margin-top:12px;}
  .jd-progress .jd-bar span{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--teal)); border-radius:99px; transition:width .4s;}
  .jd-row{display:flex; align-items:center; gap:12px; padding:14px 18px; margin-bottom:10px; cursor:pointer; transition:border-color .15s, transform .15s;}
  .jd-row:hover{border-color:var(--gold); transform:translateY(-1px);}
  .jd-order{width:30px; height:30px; border-radius:9px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;}
  .jd-code{font-size:11px; color:var(--gold); background:#fbf3e2; padding:2px 8px; border-radius:6px; margin-inline-start:4px;}
  .jd-score{font-weight:800; color:var(--teal); font-size:14px;}
  .btn-back{background:none; border:none; color:var(--muted); font-family:inherit; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-bottom:12px; padding:4px 0;}
  .btn-back:hover{color:var(--ink);}
  .jd-members{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .jd-chip{font-size:12.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--border);}
  .jd-file{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; color:var(--ink); text-decoration:none;}
  .jd-file:hover{border-color:var(--gold);}
  .jd-crit{padding:14px 0; border-bottom:1px solid var(--border);}
  .jd-crit-name{font-size:14px; font-weight:700;}
  .jd-weight{font-size:12px; color:var(--muted); white-space:nowrap;}
  .jd-info{width:24px; height:24px; border-radius:50%; border:1px solid var(--border); background:none; color:var(--muted); cursor:pointer; font-size:12px; line-height:1;}
  .jd-crit-desc{display:none; font-size:12.5px; color:var(--muted); line-height:1.8; white-space:pre-line; background:var(--border-light); border-radius:9px; padding:10px 12px; margin-top:8px;}
  .jd-crit-desc.open{display:block;}
  .jd-btns{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  #jd-search{padding:9px 14px; border:1px solid var(--border); border-radius:20px; font-family:inherit; font-size:13px; background:var(--card); color:var(--ink);}
  #jd-search:focus{outline:none; border-color:var(--gold);}
</style>

<body>

<div style="background:rgba(253,252,250,.95); border-bottom:1px solid var(--border); padding:14px 20px; text-align:center;">
  <a href="./index.html" style="text-decoration:none"><img src="./qassim-logo.png" alt="جامعة القصيم" style="height:28px; display:inline-block; vertical-align:middle;">

  <!-- دخول -->
  <div id="pane-login">
    <div class="field"><input type="email" id="gate-email" placeholder="البريد الإلكتروني"></div>
    <div class="field"><input type="password" id="gate-password" placeholder="كلمة المرور"></div>
    <button class="btn btn-primary" onclick="handleGateLogin()">دخول</button>

  <!-- تقديم -->
  <div id="pane-apply" style="display:none">
    <div class="switcher" style="margin-bottom:14px">
      <button id="ap-new" class="active" onclick="applyMode('new')">حساب جديد</button>
      <button id="ap-existing" onclick="applyMode('existing')">لدي حساب</button>

    <div id="ap-new-fields">

      <div class="field"><input type="email" id="ap-email" placeholder="البريد الإلكتروني"></div>
      <div class="field"><input id="ap-phone" placeholder="رقم الجوال"></div>
      <div class="field"><input id="ap-org" placeholder="الجهة"></div>

    <div id="ap-existing-fields" style="display:none">
      <div class="field"><input type="email" id="ap-login-email" placeholder="البريد الإلكتروني"></div>
      <div class="field"><input type="password" id="ap-login-password" placeholder="كلمة المرور"></div>

    <div class="field"><input id="ap-position" placeholder="المنصب الحالي (اختياري)"></div>

  <!-- حالة الطلب -->
  <div id="pane-status" style="display:none;text-align:center;padding:10px 0">

</div>

<div id="content-screen" style="display:none">
  <header>
    <div class="hdr-brand">
      <img src="./chair-logo.png" alt="كرسي الشيخ عبدالله بن صالح الراشد الحميد">
      <div class="sep"></div>
      <img src="./qassim-logo.png" alt="جامعة القصيم">
    </div>
    <div class="header-row">
      <div class="hdr-title">
        <div class="hdr-mark"><img src="./seera-mark.svg" alt="هاكثون السيرة النبوية"></div>

        </div>

      <div style="display:flex;align-items:center;gap:10px">
        <button id="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع الداكن/الفاتح" style="background:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;width:32px;height:32px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><i data-lucide="moon" style="width:15px;height:15px"></i></button>
        <button class="btn-link" onclick="handleLogout()">تسجيل الخروج</button>
      </div>
    </div>
  </header>
  <main>
    <div class="tabs" style="display:flex;gap:8px;margin-bottom:16px">
      <div class="tab active" id="judge-tab-teams" onclick="switchJudgeTab('teams')" style="cursor:pointer;padding:9px 18px;border-radius:20px;background:var(--navy);color:#fff;font-size:13px"><i data-lucide="scale" style="width:14px;height:14px;vertical-align:-2px"></i> الفرق والتقييم</div>
      <div class="tab" id="judge-tab-projects" onclick="switchJudgeTab('projects')" style="cursor:pointer;padding:9px 18px;border-radius:20px;background:#f0f1f5;color:var(--ink);font-size:13px"><i data-lucide="folder-open" style="width:14px;height:14px;vertical-align:-2px"></i> كل المشاريع</div>
      <div class="tab" id="judge-tab-certs" onclick="switchJudgeTab('certs')" style="cursor:pointer;padding:9px 18px;border-radius:20px;background:#f0f1f5;color:var(--ink);font-size:13px"><i data-lucide="award" style="width:14px;height:14px;vertical-align:-2px"></i> شهاداتي</div>
    </div>

  </main>

<div id="modal-overlay" style="display:flex; position:fixed; inset:0; background:rgba(11,19,38,.5); align-items:center; justify-content:center; z-index:100; padding:20px; opacity:0; pointer-events:none; transition:opacity .15s;">
  <div id="modal-box" style="background:#fff; border-radius:14px; padding:24px; width:100%; max-width:440px;"></div>
</div>
<style>
  #modal-overlay.active{ opacity:1; pointer-events:auto; }
</style>

<script>
const SUPABASE_URL = window.SEERA_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.SEERA_CONFIG.SUPABASE_ANON_KEY;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById("modal-overlay").addEventListener("click", (e)=>{
  if(e.target.id === "modal-overlay") e.target.classList.remove("active");
});
let currentUser = null;
let activeRound = null;
let criteriaList = [];

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function jsArg(v){
  return JSON.stringify(v === undefined ? null : v).replace(/[&'<>]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4,"0"));
}
// تُستخدم بعرض الشهادة — لم تكن معرّفة بهذه الصفحة سابقًا
function fmtDate(d){
  if(!d) return "";
  return new Date(d).toLocaleDateString("ar-SA", { year:"numeric", month:"long", day:"numeric" });
}

async function handleGateLogin(){
  const alertBox = document.getElementById("gate-alert");
  alertBox.className = "alert";
  const email = document.getElementById("gate-email").value.trim();
  const password = document.getElementById("gate-password").value;
  if(!email || !password){ alertBox.textContent = "أدخل البريد وكلمة المرور"; alertBox.className = "alert error"; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alertBox.textContent = "بيانات الدخول غير صحيحة"; alertBox.className = "alert error"; return; }

  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.user.id);
  const roleKeys = (roles||[]).map(r => r.roles?.key);
  if(!roleKeys.includes("judge") && !roleKeys.includes("admin")){
    await sb.auth.signOut();
    alertBox.textContent = "هذا الحساب لا يملك صلاحية التحكيم"; alertBox.className = "alert error";
    return;
  }
  currentUser = data.user;
  showContent();
}
function toggleTheme(){
  const isDark = document.body.classList.toggle("dark");
  document.getElementById("theme-toggle").innerHTML = isDark
    ? '<i data-lucide="sun" style="width:15px;height:15px"></i>'
    : '<i data-lucide="moon" style="width:15px;height:15px"></i>';
  if(window.lucide) lucide.createIcons();
  localStorage.setItem("seera-theme", isDark ? "dark" : "light");
}
if(localStorage.getItem("seera-theme") === "dark"){
  document.body.classList.add("dark");
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("theme-toggle");
    if(btn) btn.innerHTML = '<i data-lucide="sun" style="width:15px;height:15px"></i>';
  });
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById("content-screen").style.display = "none";
  document.getElementById("auth-gate-screen").style.display = "block";
}
function gateTab(t){
  document.getElementById("tab-login").classList.toggle("active", t === "login");
  document.getElementById("tab-apply").classList.toggle("active", t === "apply");
  document.getElementById("pane-login").style.display = t === "login" ? "block" : "none";
  document.getElementById("pane-apply").style.display = t === "apply" ? "block" : "none";
  const a = document.getElementById("gate-alert");
  a.textContent = ""; a.className = "alert";
}

function applyMode(m){
  document.getElementById("ap-new").classList.toggle("active", m === "new");
  document.getElementById("ap-existing").classList.toggle("active", m === "existing");
  document.getElementById("ap-new-fields").style.display      = m === "new" ? "block" : "none";
  document.getElementById("ap-existing-fields").style.display = m === "existing" ? "block" : "none";
}

function gateAlert(msg, type){
  const a = document.getElementById("gate-alert");
  a.textContent = msg;
  a.className = "alert " + (type || "error");
}

// رابط واحد لكل دور: الصفحة تتصرّف حسب حالة الزائر.
// غير مسجّل → دخول أو تقديم · طلب معلّق → حالته · معتمَد → اللوحة.
async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(!data.session) return;

  const uid = data.session.user.id;
  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", uid);
  const keys = (roles || []).map(r => r.roles?.key);

  if(keys.includes("judge") || keys.includes("admin")){
    currentUser = data.session.user;
    showContent();
    return;
  }

  // مسجّل بلا دور: نعرض حالة طلبه
  const { data: app } = await sb.from("judge_applications")
    .select("status").eq("user_id", uid).maybeSingle();

  document.getElementById("gate-tabs").style.display = "none";
  document.getElementById("pane-login").style.display = "none";
  document.getElementById("pane-apply").style.display = "none";
  document.getElementById("pane-status").style.display = "block";

  document.getElementById("status-text").textContent =
    !app                      ? "لم يُسجَّل لكم طلب انضمام بعد. سجّلوا الخروج ثم قدّموا طلبًا جديدًا."
    : app.status === "pending"  ? "طلبكم قيد المراجعة من فريق التنظيم. سنُشعركم فور اعتماده."
    : app.status === "rejected" ? "نعتذر عن عدم إمكانية قبول طلبكم في هذه الدورة."
    : "طلبكم معتمد. إن لم تظهر لوحتكم، يرجى تسجيل الخروج والدخول من جديد.";
}
restoreSession();

async function submitApplication(){
  const mode = document.getElementById("ap-new").classList.contains("active") ? "new" : "existing";
  const spec = document.getElementById("ap-spec").value.trim();
  const bio  = document.getElementById("ap-bio").value.trim();
  const pos  = document.getElementById("ap-position").value.trim();

  if(!spec){ gateAlert("التخصص أو المجال مطلوب"); return; }

  let uid = null;

  if(mode === "new"){
    const name  = document.getElementById("ap-name").value.trim();
    const email = document.getElementById("ap-email").value.trim();
    const phone = document.getElementById("ap-phone").value.trim();
    const org   = document.getElementById("ap-org").value.trim();
    const pass  = document.getElementById("ap-password").value;

    if(!name || !email || !pass){ gateAlert("الاسم والبريد وكلمة المرور مطلوبة"); return; }
    if(pass.length < 6){ gateAlert("كلمة المرور يجب ألا تقل عن ستة أحرف"); return; }

    const { data, error } = await sb.auth.signUp({
      email, password: pass,
      options: { data: { full_name: name, phone, organization: org } }
    });
    if(error){
      gateAlert(error.message.includes("already")
        ? "هذا البريد مسجّل مسبقًا — استخدموا «لدي حساب»" : error.message);
      return;
    }
    if(!data.session){
      gateAlert("تحققوا من بريدكم لتأكيد الحساب، ثم عودوا واستخدموا «لدي حساب»", "success");
      return;
    }
    uid = data.user.id;
  } else {
    const email = document.getElementById("ap-login-email").value.trim();
    const pass  = document.getElementById("ap-login-password").value;
    if(!email || !pass){ gateAlert("البريد وكلمة المرور مطلوبان"); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ gateAlert("بيانات الدخول غير صحيحة"); return; }
    uid = data.user.id;
  }

  // من اعتُمد سابقًا لا يُعيد التقديم — إعادة الإرسال تُرجع الحالة
  // إلى pending فيفقد صلاحيته.
  const { data: myRoles } = await sb.from("user_roles").select("roles(key)").eq("user_id", uid);
  if((myRoles || []).some(r => r.roles?.key === "judge")){
    gateAlert("حسابكم معتمد بالفعل — جارٍ فتح لوحتكم", "success");
    setTimeout(() => location.reload(), 1200);
    return;
  }

  // تعارض المصالح: عضو فريق لا يكون محكّمًا بنفس الحساب
  const { data: mem } = await sb.from("team_members").select("id").eq("user_id", uid).limit(1);
  if(mem && mem.length){
    gateAlert("هذا الحساب مسجَّل عضوًا بأحد الفرق. لمنع تعارض المصالح، استخدموا بريدًا مختلفًا");
    return;
  }

  if(pos) await sb.from("profiles").update({ current_position: pos }).eq("id", uid);

  const { error: appErr } = await sb.from("judge_applications").upsert({
    user_id: uid, specialization: spec, bio: bio || null, status: "pending"
  }, { onConflict: "user_id" });

  if(appErr){ gateAlert("تعذّر إرسال الطلب: " + appErr.message); return; }

  gateAlert("تم إرسال طلبكم. سنُشعركم فور مراجعته", "success");
  setTimeout(() => location.reload(), 1600);
}

/* ---------------- بطاقة اللجنة ---------------- */
// المحكّم يحتاج معرفة زملائه في اللجنة: الجلسات تُعقد معًا،
// والتنسيق بينهم أسهل حين يعرف من معه.

/* ---------------- دليل المعايير ---------------- */
// كان شرح كل معيار يتكرر داخل بطاقة كل مشروع — يطيلها بلا
// فائدة. المعايير ثابتة للجولة، فمكانها الطبيعي أعلى الصفحة
// مرة واحدة.

function buildCriteriaGuide(){
  if(!criteriaList.length) return "";
  const total = criteriaList.reduce((a, c) => a + (c.weight || 0), 0);

  return `
    <details class="crit-guide">
      <summary><span class="cg-row">
        <i data-lucide="clipboard-list"></i>
        <span class="cg-title">معايير التقييم</span>
        <span class="cg-count"><bdi>${criteriaList.length}</bdi> معايير · <bdi>${total}</bdi>%</span>
        <span class="cg-more">عرض التفاصيل</span>
      </span></summary>
      <div class="cg-body">
        ${criteriaList.map(cr => `
          <div class="cg-item">
            <div class="cg-head">
              <span class="cg-name">${esc(cr.name_ar)}</span>
              <span class="cg-w"><bdi>${cr.weight}</bdi>% · من <bdi>${cr.max_score}</bdi></span>
            </div>
            ${cr.description ? `<div class="cg-desc">${esc(cr.description)}</div>` : ""}
          </div>`).join("")}
      </div>
    </details>`;
}

async function buildCommitteeCard(committeeId){
  if(!committeeId) return "";

  const { data: com, error } = await sb.from("judging_committees")
    .select("name_ar, description, tracks(name_ar), committee_members(profiles(id, full_name, specialization, organization))")
    .eq("id", committeeId).maybeSingle();

  if(error || !com) return "";

  const mem = com.committee_members || [];
  const me  = currentUser.id;

  return `
    <div class="card com-card">
      <div class="cc-head">
        <i data-lucide="users-round"></i>
        <div>
          <div class="cc-title">${esc(com.name_ar)}</div>
          <div class="cc-sub">
            ${com.tracks?.name_ar ? esc(com.tracks.name_ar) : "كل المسارات"} ·
            <bdi>${mem.length}</bdi> محكّمًا
          </div>
        </div>
      </div>
      ${com.description ? `<p class="cc-desc">${esc(com.description)}</p>` : ""}
      <div class="cc-members">
        ${mem.map(m => {
          const p = m.profiles || {};
          const isMe = p.id === me;
          return `<div class="cc-member ${isMe ? "me" : ""}">
            <span class="cc-ava">${esc((p.full_name || "؟").trim().charAt(0))}</span>
            <span class="cc-info">
              <span class="cc-name">${esc(p.full_name || "—")}
                ${isMe ? '<span class="cc-tag me">أنت</span>' : ""}
              </span>
              ${p.specialization ? `<span class="cc-spec">${esc(p.specialization)}</span>` : ""}
            </span>
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

async function showContent(){
  document.getElementById("auth-gate-screen").style.display = "none";
  document.getElementById("content-screen").style.display = "block";
  if(window.lucide){
    lucide.createIcons();
    const observer = new MutationObserver(() => {
      clearTimeout(window._lucideDebounce);
      window._lucideDebounce = setTimeout(() => lucide.createIcons(), 60);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
  const { data: profile } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).maybeSingle();
  document.getElementById("judge-welcome").textContent = "مرحبًا، " + (profile?.full_name || currentUser.email);
  await loadAssignments();
}

function switchJudgeTab(tab){
  ["teams","projects","certs"].forEach(k => {
    const el = document.getElementById("judge-tab-" + k);
    if(!el) return;
    el.style.background = tab === k ? "var(--navy)" : "#f0f1f5";
    el.style.color      = tab === k ? "#fff" : "var(--ink)";
  });
  if(tab === "teams")         loadAssignments();
  else if(tab === "projects") renderAllProjects();
  else                        renderJudgeCertsTab();
}
async function renderJudgeCertsTab(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="card">جاري التحميل...</div>`;

  const { data: types, error } = await sb.from("certificate_types").select("*").eq("is_active", true).or("role_key.eq.judge,role_key.is.null");
  if(error){ main.innerHTML = `<div class="card"><p class="hint">خطأ: ${esc(error.message)}</p></div>`; return; }
  if(!types || !types.length){ main.innerHTML = `<div class="card"><h3>شهاداتي</h3><p class="hint">لا توجد شهادات متاحة لفئة المحكّمين بعد</p></div>`; return; }

  const { data: myCerts } = await sb.from("certificates").select("cert_type_id, verification_code, issued_at").eq("user_id", currentUser.id);
  const issuedMap = {};
  (myCerts||[]).forEach(c => issuedMap[c.cert_type_id] = c);

  const { data: myProfile } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).maybeSingle();
  const myFullName = myProfile?.full_name || currentUser.email;

  main.innerHTML = `<div class="card"><h3 style="margin:0 0 14px">شهاداتي</h3>
    ${types.map(t => {
      const issued = issuedMap[t.id];
      return `<div class="member-row">
        <span>${esc(t.name_ar)}${issued ? `<br><span style="font-size:11.5px;color:var(--muted)">صادرة ${fmtDate(issued.issued_at)} · رمز التحقق: ${esc(issued.verification_code)}</span>` : ""}</span>
        <span style="display:flex;align-items:center;gap:8px">
          ${issued
            ? `<button class="btn btn-primary btn-sm" style="width:auto;padding:8px 16px" onclick='openCertOverlay(${jsArg({name: myFullName, typeName: t.name_ar, text: t.certificate_text, introText: t.intro_text, sigLabelOverride: t.signature_label, sigNameOverride: t.signature_name, code: issued.verification_code, date: issued.issued_at}).replace(/'/g,"&#39;")})'>عرض الشهادة</button>`
            : `<button class="btn btn-outline btn-sm" style="width:auto" onclick="issueJudgeCertificate('${t.key}')">إصدار الشهادة</button>`}
        </span>
      </div>`;
    }).join("")}
  </div>`;
}
async function issueJudgeCertificate(certKey){
  const { data, error } = await sb.rpc("issue_certificate", { p_cert_type_key: certKey });
  if(error){ alert("خطأ: " + error.message); return; }
  if(!data.success){ alert("لم تكتمل الشروط بعد لإصدار هذه الشهادة"); return; }
  renderJudgeCertsTab();
}

/* ---------------- الشهادة: التصميم الموحّد في cert.js ---------------- */
async function openCertOverlay(data){ SeeraCert.open(Object.assign({ roleKey: "judge" }, data)); }

/* ============================================================
   التحكيم — على نمط «حاضنة ابتكار 5»
   • القائمة: تقدّمي + بحث + فلتر الحالة، وبطاقة لكل مشروع تفتح صفحته
   • صفحة المشروع: الوصف والملف والتسليمات والأعضاء (بلا تواصل)
   • التقييم: أزرار 1–5 لكل معيار مع الوزن والوصف، ملاحظة عامة،
     «حفظ كمسودة» (لا يدخل النتائج) و«إرسال التقييم النهائي» بعد ملخص
   • البيانات من judge_projects/save_evaluation (sql/89) — سياسة teams
     لا تسمح للمحكّم بقراءة الفرق مباشرة
   ============================================================ */
let jdProjects = [];          // كل مشاريع الجولة (المُسندة لي أولًا)
let jdEvals = {};             // team_id → تقييمي (مسودة/نهائي)
let jdFilter = "todo";        // todo | draft | done | all
let jdView = "mine";          // mine | all
let jdCurrent = null;         // المشروع المفتوح
let jdPicked = {};            // criteria_id → درجة مختارة في الصفحة المفتوحة

const RANKS = { 1: "ضعيف", 2: "مقبول", 3: "جيد", 4: "جيد جدًا", 5: "ممتاز" };

function critMax(c){ return Number(c.max_score) > 0 ? Number(c.max_score) : 5; }
function weightPct(c){
  const sum = criteriaList.reduce((a, x) => a + Number(x.weight || 0), 0) || 1;
  return Math.round(Number(c.weight || 0) / sum * 100);
}
/* المجموع الموزون من 100 لدرجات مختارة (يكفي جزء منها للعرض المؤقت) */
function weightedTotal(scores){
  let num = 0, den = 0, n = 0;
  criteriaList.forEach(c => {
    const v = Number(scores?.[c.id]);
    if(!v) return;
    num += v / critMax(c) * Number(c.weight || 0);
    den += Number(c.weight || 0);
    n++;
  });
  return { total: den ? Math.round(num / den * 1000) / 10 : null, answered: n };
}
function evalStatus(p){
  const e = jdEvals[p.team_id];
  if(e?.is_submitted) return "done";
  if(e && Object.keys(e.draft_scores || {}).length) return "draft";
  return "todo";
}
function statusBadge(st){
  return st === "done"  ? '<span class="badge badge-green">✓ أُرسل نهائيًا</span>'
       : st === "draft" ? '<span class="badge badge-gold">مسودة محفوظة</span>'
       :                  '<span class="badge badge-gray">لم يبدأ</span>';
}

async function loadAssignments(){
  jdView = "mine";
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="card"><p class="hint">جارٍ التحميل...</p></div>`;

  const { data: round } = await sb.from("judging_rounds").select("*").eq("is_active", true).limit(1).maybeSingle();
  if(!round){
    document.getElementById("round-name").textContent = "";
    main.innerHTML = `<div class="card"><div class="empty-state">لا توجد جولة تحكيم نشطة حاليًا. تواصل مع منظّم البرنامج.</div></div>`;
    return;
  }
  activeRound = round;
  document.getElementById("round-name").textContent = round.name_ar + (round.is_locked ? " · مقفلة" : "");

  const [critRes, projRes, evalRes, comRes] = await Promise.all([
    sb.from("judging_criteria").select("*").eq("round_id", round.id).order("display_order"),
    sb.rpc("judge_projects", { p_round_id: round.id }),
    sb.from("judge_evaluations").select("*").eq("judge_user_id", currentUser.id).eq("round_id", round.id),
    sb.from("committee_members").select("committee_id").eq("judge_user_id", currentUser.id).limit(1).maybeSingle(),
  ]);
  criteriaList = critRes.data || [];
  if(projRes.error){ main.innerHTML = `<div class="card"><div class="empty-state">تعذّر التحميل: ${esc(projRes.error.message)}</div></div>`; return; }
  jdProjects = projRes.data || [];
  jdEvals = {};
  (evalRes.data || []).forEach(e => { jdEvals[e.team_id] = e; });
  window._comCard = await buildCommitteeCard(comRes.data?.committee_id);

  if(!jdProjects.some(p => p.is_assigned)){
    main.innerHTML = (window._comCard || "") + `<div class="card"><div class="empty-state">لم يتم إسناد أي مشروع لك بهذه الجولة بعد</div></div>`;
    return;
  }
  renderJudgeList();
}

function setJudgeFilter(f){ jdFilter = f; renderJudgeList(); }

function renderJudgeList(){
  const main = document.getElementById("main-content");
  const mine = jdProjects.filter(p => p.is_assigned)
    .sort((a, b) => (a.judging_order ?? 999) - (b.judging_order ?? 999) || (a.team_name || "").localeCompare(b.team_name || "", "ar"));
  // المعتذر وما فيه تعارض لا يُحتسبان في تقدّم المحكّم (يظهران في «الكل» فقط)
  const active = mine.filter(p => !p.withdrawn && !p.has_conflict);
  const counts = { todo: 0, draft: 0, done: 0 };
  active.forEach(p => counts[evalStatus(p)]++);
  const total = active.length, done = counts.done;
  const pct = total ? Math.round(done / total * 100) : 0;
  if(jdFilter === "todo" && counts.todo === 0 && counts.draft === 0) jdFilter = "all";

  const term = (document.getElementById("jd-search")?.value || "").trim().toLowerCase();
  const visible = mine.filter(p => {
    const st = evalStatus(p);
    if(jdFilter !== "all" && (p.withdrawn || p.has_conflict)) return false;
    if(jdFilter === "todo" && st === "done") return false;
    if(jdFilter === "draft" && st !== "draft") return false;
    if(jdFilter === "done" && st !== "done") return false;
    if(!term) return true;
    return [p.team_name, p.team_code, p.project_title].some(x => (x || "").toLowerCase().includes(term));
  });

  const lockNote = activeRound?.is_locked
    ? `<div class="alert" style="display:block;background:#fef3e2;color:#92600a;margin-bottom:14px"><i data-lucide="lock" style="width:14px;height:14px;vertical-align:-2px;display:inline-block"></i> التحكيم مقفل لهذه الجولة — يمكنك الاطلاع على تقييماتك فقط</div>` : "";

  main.innerHTML = (window._comCard || "") + lockNote + buildCriteriaGuide() + `
    <div class="card jd-progress">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <div><strong style="font-size:15px">تقدّمك في التحكيم</strong>
          <div class="hint" style="margin-top:2px">أرسلت <bdi>${done}</bdi> من <bdi>${total}</bdi> تقييمًا نهائيًا${counts.draft ? ` · <bdi>${counts.draft}</bdi> مسودة` : ""}</div></div>
        <div style="font-size:22px;font-weight:800;color:${pct === 100 ? "var(--teal)" : "var(--gold)"}"><bdi>${pct}</bdi>%</div>
      </div>
      <div class="jd-bar"><span style="width:${pct}%"></span></div>
    </div>
    <div class="filter-bar" style="align-items:center">
      <button class="filter-chip ${jdFilter==='todo'?'active':''}" onclick="setJudgeFilter('todo')">بانتظار الإرسال (${counts.todo + counts.draft})</button>
      <button class="filter-chip ${jdFilter==='draft'?'active':''}" onclick="setJudgeFilter('draft')">مسودات (${counts.draft})</button>
      <button class="filter-chip ${jdFilter==='done'?'active':''}" onclick="setJudgeFilter('done')">أُرسلت (${counts.done})</button>
      <button class="filter-chip ${jdFilter==='all'?'active':''}" onclick="setJudgeFilter('all')">الكل (${mine.length})</button>
      <input id="jd-search" placeholder="بحث باسم الفريق أو المشروع..." value="${esc(term)}" oninput="renderJudgeList();this.focus();this.setSelectionRange(this.value.length,this.value.length)" style="flex:1;min-width:170px;margin-inline-start:auto">
    </div>
    ${visible.length ? visible.map(p => projectRowHtml(p, true)).join("") : `<div class="card"><div class="empty-state">${
      jdFilter === "todo" ? "أرسلت تقييم كل المشاريع المسندة لك. شكرًا لك." : "لا مشاريع بهذا التصنيف"}</div></div>`}`;
  if(window.lucide) lucide.createIcons();
}

function projectRowHtml(p, mine){
  const st = mine ? evalStatus(p) : null;
  const e = jdEvals[p.team_id];
  const t = e ? weightedTotal(e.draft_scores) : null;
  return `<div class="card jd-row" onclick='openProject(${jsArg(p.team_id)})'>
    ${p.judging_order ? `<span class="jd-order"><bdi>${p.judging_order}</bdi></span>` : ""}
    <div style="flex:1;min-width:0">
      <div style="font-size:14.5px;font-weight:700">${esc(p.team_name || "—")}
        ${p.team_code ? `<code class="jd-code">${esc(p.team_code)}</code>` : ""}</div>
      <div class="hint" style="margin-top:2px">${esc(p.project_title || "لم يقدّم الفريق فكرته بعد")}${p.track_name ? ` · ${esc(p.track_name)}` : ""}</div>
    </div>
    ${p.withdrawn ? '<span class="badge badge-red">معتذر</span>' : ""}
    ${mine && p.has_conflict ? '<span class="badge badge-red">تعارض مصالح</span>' : ""}
    ${mine ? statusBadge(st) : (p.is_assigned ? '<span class="badge badge-gold">مُسند إليك</span>' : '<span class="badge badge-gray">للاطلاع</span>')}
    ${mine && t && t.total !== null && st === "done" ? `<span class="jd-score"><bdi>${t.total}</bdi></span>` : ""}
    <i data-lucide="chevron-left" style="width:16px;height:16px;color:var(--muted)"></i>
  </div>`;
}

/* ---------------- صفحة المشروع والتقييم ---------------- */

  main.innerHTML = `
    <button class="btn-back" onclick="backToList()"><i data-lucide="arrow-right" style="width:15px;height:15px"></i> رجوع للقائمة</button>
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div>
          <div style="font-size:17px;font-weight:800">${esc(p.team_name || "—")}
            ${p.team_code ? `<code class="jd-code">${esc(p.team_code)}</code>` : ""}</div>
          <div class="hint" style="margin-top:4px">${esc(p.track_name || "—")}${p.committee_name ? ` · ${esc(p.committee_name)}` : ""}${p.judging_order ? ` · ترتيب العرض <bdi>${p.judging_order}</bdi>` : ""}</div>
        </div>
        ${p.is_assigned ? statusBadge(evalStatus(p)) : '<span class="badge badge-gray">للاطلاع فقط</span>'}
      </div>
      ${members.length ? `<div class="jd-members">${members.map(m => `<span class="jd-chip">${esc(m.name || "—")}${m.is_leader ? ' <span style="color:var(--gold)">★</span>' : ""}</span>`).join("")}</div>` : ""}
    </div>

    <div class="project-card" style="margin-bottom:14px">
      <div class="project-card-head">
        <div class="project-card-icon"><i data-lucide="lightbulb"></i></div>
        <div><div class="project-card-title">${esc(p.project_title || "لم يقدّم الفريق فكرته بعد")}</div></div>
      </div>
      ${p.project_description ? `<div class="project-card-desc" style="white-space:pre-line">${esc(p.project_description)}</div>` : ""}
      ${p.project_file_url ? `<a href="${esc(p.project_file_url)}" target="_blank" rel="noopener" class="project-card-file"><i data-lucide="paperclip" style="width:13px;height:13px"></i> فتح ملف المشروع</a>` : ""}
    </div>

    <div class="card" style="margin-bottom:14px">
      <div style="font-weight:700;margin-bottom:10px"><i data-lucide="folder-open" style="width:15px;height:15px;vertical-align:-3px"></i> ملفات الفريق والعرض التقديمي</div>
      ${deliv.length ? deliv.map(d => `<a class="jd-file" href="${esc(d.file_url || "#")}" target="_blank" rel="noopener">
          <i data-lucide="file-text" style="width:15px;height:15px"></i>
          <span style="flex:1;min-width:0"><strong>${esc(d.title || "تسليم")}</strong><br><span class="hint">${esc(d.file_name || "")}</span></span>
          <i data-lucide="external-link" style="width:14px;height:14px;color:var(--muted)"></i></a>`).join("")
        : `<p class="hint" style="margin:0">لم يرفع الفريق ملفات بعد</p>`}
    </div>

    <div class="card" id="jd-scoring"></div>`;
  renderScoring();
  window.scrollTo({ top: 0, behavior: "smooth" });
  if(window.lucide) lucide.createIcons();
}

function backToList(){
  jdCurrent = null;
  if(jdView === "all") renderAllProjects(); else renderJudgeList();
}

function renderScoring(){
  const box = document.getElementById("jd-scoring");
  const p = jdCurrent;
  if(!box || !p) return;
  const e = jdEvals[p.team_id];
  const info = (icon, msg, color) => `<div class="alert" style="display:block;background:${color || "#eef4fb"};color:${color ? "#92600a" : "#1f4e79"}"><i data-lucide="${icon}" style="width:14px;height:14px;vertical-align:-2px;display:inline-block"></i> ${msg}</div>`;

  if(!p.is_assigned){ box.innerHTML = info("info", "هذا المشروع للاطلاع فقط — غير مُسند إليك للتقييم بهذه الجولة."); return; }
  if(!criteriaList.length){ box.innerHTML = info("info", "لم تُحدَّد معايير التقييم لهذه الجولة بعد."); return; }

  const reason = p.has_conflict ? "لديك تعارض مصالح مع هذا الفريق — لا يمكنك تقييمه. تواصل مع الإدارة."
    : p.withdrawn ? "اعتذر هذا المشروع عن التحكيم في هذه الجولة."
    : activeRound?.is_locked ? "التحكيم مقفل لهذه الجولة — لا يمكن تسجيل أو تعديل أي درجة الآن."
    : activeRound?.results_published ? "نُشرت نتائج هذه الجولة — التعديل مقفل."
    : p.approved ? "اعتمدت اللجنة نتيجة هذا الفريق — التعديل مقفل."
    : e?.is_submitted ? "أرسلت تقييمك النهائي لهذا المشروع — لا يمكن تعديله. إن احتجت تعديلًا فتواصل مع الإدارة."
    : null;
  const readOnly = !!reason;
  const t = weightedTotal(jdPicked);

  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:15px;font-weight:800">التقييم</div>
      <div class="hint">1 ضعيف · 3 جيد · 5 ممتاز</div>
    </div>
    ${reason ? info(e?.is_submitted ? "check-circle" : "lock", reason, e?.is_submitted ? null : "#fef3e2") : ""}
    ${criteriaList.map(c => {
      const cur = Number(jdPicked[c.id]) || null;
      return `<div class="jd-crit">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="jd-crit-name">${esc(c.name_ar)}</span>
            ${c.description ? `<button type="button" class="jd-info" title="وصف المعيار" onclick='toggleCritDesc(${jsArg(c.id)})'>ℹ</button>` : ""}
          </div>
          <span class="jd-weight">الوزن <bdi>${weightPct(c)}</bdi>%</span>
        </div>
        ${c.description ? `<div class="jd-crit-desc" id="jd-desc-${c.id}">${esc(c.description)}</div>` : ""}
        <div class="jd-btns">
          ${Array.from({ length: critMax(c) }, (_, i) => i + 1).map(n => `
            <button type="button" class="score-btn ${cur === n ? "selected" : ""}" ${readOnly ? "disabled" : ""}
              title="${RANKS[n] || ""}" onclick='pickScore(${jsArg(c.id)}, ${n})'>${n}</button>`).join("")}
          ${cur ? `<span class="hint" style="align-self:center">${RANKS[cur] || ""}</span>` : ""}
        </div>
      </div>`;
    }).join("")}
    <div class="live-total-bar" style="margin-top:14px">
      <span class="lbl">${t.answered === criteriaList.length ? "الدرجة الموزونة الإجمالية" : `اخترت <bdi>${t.answered}</bdi> من <bdi>${criteriaList.length}</bdi> معايير`}</span>
      <span class="val">${t.total !== null ? `<bdi>${t.total}</bdi>` : "—"} <small>/ 100</small></span>
    </div>
    <div class="field" style="margin-top:14px"><label>ملاحظة عامة للفريق (اختياري)</label>
      <textarea id="jd-note" rows="3" placeholder="تظهر للفريق بعد إعلان النتائج" ${readOnly ? "disabled" : ""}>${esc(e?.overall_note || "")}</textarea>
    </div>
    <div id="jd-alert" class="alert"></div>
    ${readOnly ? "" : `<div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-outline" id="jd-draft-btn" style="width:auto;padding:11px 20px" onclick="saveEvaluation(false)">حفظ كمسودة</button>
      <button class="btn btn-primary" id="jd-submit-btn" style="width:auto;padding:11px 20px" onclick="openConfirmSubmit()">إرسال التقييم النهائي</button>
    </div>
    <p class="hint" style="margin:10px 0 0">المسودة لا تُحتسب في النتائج. بعد الإرسال النهائي لا يمكن التعديل.</p>`}`;
  if(window.lucide) lucide.createIcons();
}

function toggleCritDesc(id){
  const d = document.getElementById("jd-desc-" + id);
  if(d) d.classList.toggle("open");
}
function pickScore(critId, n){
  jdPicked[critId] = n;
  const note = document.getElementById("jd-note")?.value;
  renderScoring();
  const ta = document.getElementById("jd-note");
  if(ta && note !== undefined) ta.value = note;
}

/* ملخص قبل الإرسال النهائي */
function openConfirmSubmit(){
  const alertBox = document.getElementById("jd-alert");
  const missing = criteriaList.filter(c => !jdPicked[c.id]);
  if(missing.length){
    alertBox.textContent = "يرجى اختيار درجة لكل المعايير قبل الإرسال النهائي.";
    alertBox.className = "alert error";
    return;
  }
  const t = weightedTotal(jdPicked);
  const note = document.getElementById("jd-note").value.trim();
  const overlay = document.createElement("div");
  overlay.className = "confirm-overlay";
  overlay.id = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-box">
      <h3>ملخص التقييم قبل الإرسال</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:14px">${esc(jdCurrent.team_name)} — راجع درجاتك، لا يمكن تعديلها بعد الإرسال.</p>
      ${criteriaList.map(c => `<div class="confirm-row"><span>${esc(c.name_ar)} <span class="hint">(${weightPct(c)}%)</span></span><strong><bdi>${jdPicked[c.id]}</bdi> / <bdi>${critMax(c)}</bdi></strong></div>`).join("")}
      ${note ? `<div class="hint" style="margin-top:10px">ملاحظتك: ${esc(note)}</div>` : ""}
      <div class="confirm-total-row"><span>الدرجة الموزونة الإجمالية</span><span><bdi>${t.total}</bdi> / 100</span></div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn btn-outline" style="flex:1" onclick="document.getElementById('confirm-overlay').remove()">رجوع للتعديل</button>
        <button class="btn btn-primary" style="flex:1" onclick="document.getElementById('confirm-overlay').remove(); saveEvaluation(true)">تأكيد الإرسال النهائي</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function saveEvaluation(isSubmit){
  const p = jdCurrent;
  if(!p) return;
  const alertBox = document.getElementById("jd-alert");
  const note = document.getElementById("jd-note")?.value.trim() || "";
  const btn = document.getElementById(isSubmit ? "jd-submit-btn" : "jd-draft-btn");
  const label = btn?.textContent;
  if(btn){ btn.disabled = true; btn.textContent = "جارٍ الحفظ…"; }

  const { data, error } = await sb.rpc("save_evaluation", {
    p_round_id: activeRound.id, p_team_id: p.team_id, p_scores: jdPicked, p_note: note, p_submit: isSubmit
  });
  if(btn){ btn.disabled = false; btn.textContent = label; }
  if(error || !data?.success){
    alertBox.textContent = data?.error || error?.message || "تعذّر الحفظ";
    alertBox.className = "alert error";
    return;
  }
  jdEvals[p.team_id] = Object.assign(jdEvals[p.team_id] || {}, {
    team_id: p.team_id, draft_scores: Object.assign({}, jdPicked), overall_note: note,
    is_submitted: isSubmit, submitted_at: isSubmit ? new Date().toISOString() : null
  });
  if(isSubmit){
    renderScoring();
    const a = document.getElementById("jd-alert");
    a.textContent = "تم إرسال تقييمك النهائي — شكرًا لك";
    a.className = "alert success";
  } else {
    alertBox.textContent = "حُفظت المسودة — لا تُحتسب حتى ترسل التقييم النهائي";
    alertBox.className = "alert success";
  }
}

/* ---------------- كل المشاريع (اطّلاع) ---------------- */
async function renderAllProjects(){
  jdView = "all";
  const box = document.getElementById("main-content");
  if(!activeRound || !jdProjects.length){
    box.innerHTML = `<div class="card"><p class="hint">جارٍ التحميل...</p></div>`;
    const { data: round } = await sb.from("judging_rounds").select("*").eq("is_active", true).limit(1).maybeSingle();
    if(!round){ box.innerHTML = `<div class="card"><div class="empty-state">لا توجد جولة تحكيم نشطة حاليًا</div></div>`; return; }
    activeRound = round;
    const [crit, proj] = await Promise.all([
      sb.from("judging_criteria").select("*").eq("round_id", round.id).order("display_order"),
      sb.rpc("judge_projects", { p_round_id: round.id }),
    ]);
    criteriaList = crit.data || [];
    jdProjects = proj.data || [];
  }
  const tracks = [...new Set(jdProjects.map(p => p.track_name).filter(Boolean))].sort();
  box.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="ap-bar">
        <div class="field" style="margin:0;flex:1;min-width:190px">
          <label>بحث بالمشروع أو الفريق أو رقمه</label>
          <input id="ap-search" placeholder="اكتب للبحث..." oninput="filterAllProjects()">
        </div>
        <div class="field" style="margin:0;min-width:170px">
          <label>المسار</label>
          <select id="ap-track" onchange="filterAllProjects()">
            <option value="">كل المسارات</option>
            ${tracks.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}
          </select>
        </div>
      </div>
      <p class="hint" id="ap-count" style="margin:12px 0 0"></p>
    </div>
    <div id="ap-list"></div>`;
  filterAllProjects();
}

function filterAllProjects(){
  const term  = (document.getElementById("ap-search")?.value || "").trim().toLowerCase();
  const track = document.getElementById("ap-track")?.value || "";
  const shown = jdProjects.filter(p => {
    if(track && p.track_name !== track) return false;
    if(!term) return true;
    return [p.project_title, p.team_name, p.team_code].some(x => (x || "").toLowerCase().includes(term));
  });
  const cnt = document.getElementById("ap-count");
  if(cnt) cnt.textContent = shown.length === jdProjects.length ? `${jdProjects.length} مشروعًا` : `${shown.length} من ${jdProjects.length}`;
  const list = document.getElementById("ap-list");
  list.innerHTML = shown.length ? shown.map(p => projectRowHtml(p, false)).join("")
    : `<div class="card"><div class="empty-state">لا مشاريع مطابقة</div></div>`;
  if(window.lucide) lucide.createIcons();
}
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإرشاد | هاكثون السيرة النبوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="cert.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#28323C; --navy-dark:#1B232B; --navy-light:#3A4754; --purple:#A67C00; --teal:#B8860B;
    --gold:#D9A400; --bg:#FEFAEC; --card:#FFFFFF; --ink:#1A1A2E; --muted:#6B7A99;
    --border:#E4E6EF; --border-light:#EEF0F5; --danger:#C0392B; --radius:14px;
  }
  body.dark{
    --bg:#161C22; --card:#1E262E; --ink:#EEF0F2; --muted:#8b96a8; --border:#2F3944; --border-light:#252E37;
  }
  body.dark .stat-card, body.dark .card{ color:var(--ink); }
  /* كل المشاريع */
  .ap-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .ap-card{margin-bottom:12px}
  .ap-head{display:flex;align-items:flex-start;gap:12px}
  .ap-title{font-size:15.5px;font-weight:700;color:var(--navy)}
  .ap-meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .ap-meta code{font-size:10.5px;color:var(--gold);background:#FBF3E2;
    padding:2px 8px;border-radius:6px;margin-left:7px;margin-inline-end:7px}
  .ap-fold{margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}
  .ap-fold summary{cursor:pointer;list-style:none;display:block;padding:2px 0}
  .ap-fold summary::-webkit-details-marker{display:none}
  .ap-row{display:flex;align-items:center;gap:7px;font-size:12.5px;
    font-weight:600;color:var(--navy)}
  .ap-row i,.ap-row svg{width:14px;height:14px;color:var(--teal);flex-shrink:0;
    margin-left:7px;margin-inline-end:7px}
  .ap-row>span:first-of-type{flex:1;min-width:0}
  .ap-more{font-size:11px;color:var(--teal);background:rgba(217,164,0,.1);
    padding:2px 10px;border-radius:6px;font-weight:600;white-space:nowrap}
  .ap-fold[open] .ap-more{visibility:hidden}
  .ap-body{margin-top:9px;font-size:12.5px;line-height:1.85;color:var(--ink);
    white-space:pre-line;overflow-wrap:break-word;word-break:break-word}
  .ap-file{display:inline-flex;align-items:center;gap:7px;margin-top:11px;
    font-size:12.5px;color:var(--teal);text-decoration:none;font-weight:600}
  .ap-file i,.ap-file svg{width:14px;height:14px;margin-left:7px;margin-inline-end:7px}
  .ap-file:hover{text-decoration:underline}

  body.dark input, body.dark select, body.dark textarea{
    background:#1B232B !important; color:var(--ink) !important; border-color:var(--border) !important;
  }
  body.dark .slot-row{ background:var(--card); }
  /* تمييز حالة الموعد بخط جانبي — أوضح من الشارة وحدها */
  .slot-row{border-right:3px solid transparent;transition:.18s}
  .sl-booked{border-right-color:#B8860B}
  .sl-live{border-right-color:#D9A400;background:rgba(217,164,0,.045)}
  .sl-done{border-right-color:#8FA6BC;background:#FAFBFC}
  .sl-done .slot-time{color:var(--muted)}
  .sl-free{border-right-color:#D5DBE3}
  .sl-expired{border-right-color:#D5DBE3;opacity:.62}
  .sl-cancelled{border-right-color:#C0392B;opacity:.6}
  body.dark .sl-done{background:rgba(255,255,255,.02)}
  body.dark .sl-live{background:rgba(217,164,0,.08)}

  body.dark .project-box{ background:#1B232B; }
  /* طيّ تفاصيل المشروع — بعضها طويل ويملأ الصفحة */
  .proj-fold{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .proj-fold summary{cursor:pointer;list-style:none;font-size:13px;
    color:var(--navy);font-weight:600;padding:3px 0;display:block}
  .proj-fold summary>span.row{display:flex;align-items:center;gap:7px}
  .proj-fold summary::-webkit-details-marker{display:none}
  .proj-fold summary i,.proj-fold summary svg{width:14px;height:14px;color:var(--gold);flex-shrink:0}
  .proj-fold summary .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proj-fold summary .more{font-size:11.5px;color:var(--teal);font-weight:600;
    background:rgba(217,164,0,.1);padding:2px 9px;border-radius:6px;white-space:nowrap}
  .proj-fold[open] summary .more{visibility:hidden}
  .proj-body{padding-top:10px;animation:fold .22s ease}
  @keyframes fold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* تبويبات المواعيد */
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .subtab{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;
    border:1px solid var(--border);background:#fff;color:var(--muted);
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s}
  .subtab:hover{border-color:var(--teal);color:var(--navy)}
  .subtab.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .subtab i,.subtab svg{width:15px;height:15px}
  .subtab .cnt{background:rgba(0,0,0,.08);padding:1px 8px;border-radius:20px;font-size:11.5px}
  .subtab.active .cnt{background:rgba(255,255,255,.2)}
  body.dark .subtab{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
  body.dark .subtab.active{background:var(--teal);border-color:var(--teal);color:#28323C}

  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink);}

  header{background:linear-gradient(135deg,#28323C 0%,#3A4754 58%,#00304F 100%); color:#fff; padding:18px 24px;}
  .hdr-brand{display:flex; align-items:center; margin-bottom:14px;}
  .hdr-brand img{height:26px; width:auto; flex-shrink:0; display:block; object-fit:contain;}
  .hdr-brand .sep{width:1px; height:20px; flex-shrink:0; margin:0 18px; background:rgba(255,255,255,.28);}
  .hdr-mark{width:46px; height:46px; border-radius:10px; overflow:hidden; flex-shrink:0; margin-left:14px; margin-inline-end:14px;
            box-shadow:0 0 26px rgba(217,164,0,.3);}
  .hdr-mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .hdr-title{display:flex; align-items:center;}
  @media (max-width:640px){
    .hdr-brand img{height:22px} .hdr-brand .sep{margin:0 12px}
    .hdr-mark{width:38px;height:38px;margin-left:10px;margin-inline-end:10px}
  }
  .header-row{max-width:900px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  header h1{font-size:18px; margin:0;}
  header p{margin:2px 0 0; font-size:12.5px; color:#a9b8d4;}
  .btn-link{background:none; border:none; color:#c8d3e8; cursor:pointer; font-size:12.5px; font-family:inherit;}

  main{max-width:900px; margin:0 auto; padding:24px;}
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:22px; margin-bottom:18px;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px;}

  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border);}
  .tab{padding:9px 4px; margin-left:20px; font-size:13.5px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-weight:500;}
  .tab.active{color:var(--teal); border-color:var(--teal);}

  .field{margin-bottom:14px;}
  /* تبويبات شاشة الدخول والتقديم */
  .switcher{display:flex;gap:4px;background:var(--bg,#FEFAEC);padding:4px;border-radius:11px;margin-bottom:16px}
  .switcher button{flex:1;padding:9px 12px;border:0;border-radius:8px;background:transparent;
    font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.18s}
  .switcher button.active{background:#fff;color:var(--navy,#28323C);box-shadow:0 1px 4px rgba(40,50,60,.1)}
  body.dark .switcher{background:rgba(255,255,255,.06)}
  body.dark .switcher button.active{background:rgba(255,255,255,.14);color:#fff}
  .auth-gate textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;
    font-family:inherit;font-size:13.5px;resize:vertical}

  .field label{display:block; font-size:13px; margin-bottom:6px; font-weight:500;}
  .field input, .field textarea, .field select{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px;}
  .form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .btn{border:none; border-radius:9px; padding:11px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:#188878;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}
  .btn-sm{padding:7px 14px; font-size:12.5px;}
  .alert{padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none;}
  .alert.error{background:#fdeceb; color:var(--danger); display:block;}
  .alert.success{background:#e6f7f3; color:var(--teal); display:block;}

  .auth-gate{max-width:400px; margin:20px auto 80px; text-align:center; background:var(--card); border-radius:var(--radius); padding:36px 28px; border:1px solid var(--border);}
  .auth-gate h2{margin-bottom:6px; color:var(--navy);}
  .auth-gate p{color:var(--muted); font-size:13.5px; margin-bottom:20px;}

  .slot-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;
    padding:18px 20px; margin-bottom:12px; background:#fff; border:1px solid var(--border); border-radius:14px;
    transition:.2s; box-shadow:0 1px 2px rgba(13,27,62,.03);
  }
  .slot-row:hover{box-shadow:0 6px 18px rgba(13,27,62,.08); border-color:rgba(26,46,90,.18);}
  .slot-row.is-booked{border-right:3px solid var(--gold);}
  .slot-time{font-size:14.5px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:6px;}
  .slot-time i, .slot-time svg{width:15px; height:15px; color:var(--gold);}
  .slot-meta{font-size:12px; color:var(--muted); margin-top:3px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge-gray{background:#f0f1f5; color:var(--muted);}
  .badge-teal{background:rgba(217,164,0,.14);color:#8A6A00}
  body.dark .badge-teal{background:rgba(217,164,0,.2);color:#F7C30D}

  .badge-green{background:#e6f7f3; color:var(--teal);}

  /* كان مستخدمًا بتبويب الشهادات لكنه غير معرَّف بهذه الصفحة */
  .member-row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--border);}
  .member-row:last-child{border-bottom:none;}
  .badge-gold{background:#fbf3e2; color:var(--gold);}

  .project-box{background:var(--border-light); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-top:12px;}
  .stat-card{background:var(--border-light); border-radius:12px; padding:16px 18px; text-align:center;}
  .stat-card .num{font-size:24px; font-weight:700; color:var(--navy);}
  .stat-card .label{font-size:11.5px; color:var(--muted); margin-top:4px;}
</style>
</head>
<body>

<div style="background:rgba(253,252,250,.95); border-bottom:1px solid var(--border); padding:14px 20px; text-align:center;">
  <a href="./index.html" style="text-decoration:none"><img src="./qassim-logo.png" alt="جامعة القصيم" style="height:28px; display:inline-block; vertical-align:middle;">
  <span style="display:inline-block; width:1px; height:22px; background:var(--border); margin:0 12px; vertical-align:middle;"></span>
  <img src="./chair-logo.png" alt="كرسي الشيخ عبدالله بن صالح الراشد الحميد" style="height:28px; display:inline-block; vertical-align:middle;"></a>
</div>
<div id="auth-gate-screen" class="auth-gate">
  <h2>لوحة الإرشاد</h2>
  <p id="gate-tagline">شارك خبرتك مع فرق تبني مشاريع رقمية مبتكرة في خدمة السيرة النبوية</p>

  <div class="switcher" id="gate-tabs">
    <button id="tab-login" class="active" onclick="gateTab('login')">تسجيل الدخول</button>
    <button id="tab-apply" onclick="gateTab('apply')">التقديم كمرشد</button>
  </div>

  <div id="gate-alert" class="alert"></div>

  <!-- دخول -->
  <div id="pane-login">
    <div class="field"><input type="email" id="gate-email" placeholder="البريد الإلكتروني"></div>
    <div class="field"><input type="password" id="gate-password" placeholder="كلمة المرور"></div>
    <button class="btn btn-primary" onclick="handleGateLogin()">دخول</button>
  </div>

  <!-- تقديم -->
  <div id="pane-apply" style="display:none">
    <div class="switcher" style="margin-bottom:14px">
      <button id="ap-new" class="active" onclick="applyMode('new')">حساب جديد</button>
      <button id="ap-existing" onclick="applyMode('existing')">لدي حساب</button>
    </div>

    <div id="ap-new-fields">
      <div class="field"><input id="ap-name" placeholder="الاسم الكامل"></div>
      <div class="field"><input type="email" id="ap-email" placeholder="البريد الإلكتروني"></div>
      <div class="field"><input id="ap-phone" placeholder="رقم الجوال"></div>
      <div class="field"><input id="ap-org" placeholder="الجهة"></div>
      <div class="field"><input type="password" id="ap-password" placeholder="كلمة المرور"></div>
    </div>

    <div id="ap-existing-fields" style="display:none">
      <div class="field"><input type="email" id="ap-login-email" placeholder="البريد الإلكتروني"></div>
      <div class="field"><input type="password" id="ap-login-password" placeholder="كلمة المرور"></div>
    </div>

    <div class="field"><input id="ap-position" placeholder="المنصب الحالي (اختياري)"></div>
    <div class="field"><input id="ap-spec" placeholder="التخصص أو المجال"></div>
    <div class="field"><textarea id="ap-bio" rows="3" placeholder="نبذة عن خبرتكم"></textarea></div>

    <button class="btn btn-primary" onclick="submitApplication()">إرسال الطلب</button>
  </div>

  <!-- حالة الطلب -->
  <div id="pane-status" style="display:none;text-align:center;padding:10px 0">
    <p id="status-text" style="font-size:14.5px;line-height:1.9;margin:0 0 14px"></p>
    <button class="btn btn-outline" style="width:auto" onclick="handleLogout()">تسجيل الخروج</button>
  </div>
</div>

<div id="content-screen" style="display:none">
  <header>
    <div class="hdr-brand">
      <img src="./chair-logo.png" alt="كرسي الشيخ عبدالله بن صالح الراشد الحميد">
      <div class="sep"></div>
      <img src="./qassim-logo.png" alt="جامعة القصيم">
    </div>
    <div class="header-row">
      <div class="hdr-title">
        <div class="hdr-mark"><img src="./seera-mark.svg" alt="هاكثون السيرة النبوية"></div>
        <div><h1 id="mentor-welcome">لوحة الإرشاد</h1><p>إدارة مواعيدك وملاحظاتك للفرق</p></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button id="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع الداكن/الفاتح" style="background:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;width:32px;height:32px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><i data-lucide="moon" style="width:15px;height:15px"></i></button>
        <button class="btn-link" onclick="handleLogout()">تسجيل الخروج</button>
      </div>
    </div>
  </header>
  <main>
    <div id="presence-banner"></div>
    <div class="tabs" id="tabs-bar">
      <div class="tab active" data-t="slots"><i data-lucide="calendar-clock" style="width:14px;height:14px;vertical-align:-2px"></i> مواعيدي</div>
      <div class="tab" data-t="add"><i data-lucide="calendar-plus" style="width:14px;height:14px;vertical-align:-2px"></i> إضافة موعد جديد</div>
      <div class="tab" data-t="bulk"><i data-lucide="calendar-range" style="width:14px;height:14px;vertical-align:-2px"></i> إضافة مواعيد بالجملة</div>
      <div class="tab" data-t="profile"><i data-lucide="user-round" style="width:14px;height:14px;vertical-align:-2px"></i> ملفي الشخصي</div>
      <div class="tab" data-t="projects"><i data-lucide="folder-open" style="width:14px;height:14px;vertical-align:-2px"></i> كل المشاريع</div>
      <div class="tab" data-t="certs"><i data-lucide="award" style="width:14px;height:14px;vertical-align:-2px"></i> شهاداتي</div>
    </div>
    <div id="main-content">جاري التحميل...</div>
  </main>
</div>

<div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(11,19,38,.5); align-items:center; justify-content:center; z-index:100; padding:20px;">
  <div id="modal-box" style="background:#fff; border-radius:14px; padding:24px; width:100%; max-width:440px;"></div>
</div>

<script>
const SUPABASE_URL = window.SEERA_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.SEERA_CONFIG.SUPABASE_ANON_KEY;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentTab = "slots";

/* ---------------- كل المشاريع ---------------- */
// اطّلاع عام على مشاريع البرنامج. السياسة في القاعدة تسمح
// للمرشد والمحكّم بقراءتها، والعرض هنا بلا درجات ولا ملاحظات.

let allProjectsCache = [];

async function renderAllProjects(){
  const box = document.getElementById("main-content");
  box.innerHTML = `<div class="card"><p class="hint">جارٍ التحميل...</p></div>`;

  const { data, error } = await sb.from("submissions")
    .select("id, title, description, file_url, version, submitted_at, team_id, teams(team_name, team_code, tracks(name_ar))")
    .order("submitted_at", { ascending: false });

  if(error){
    box.innerHTML = `<div class="card"><p class="hint">تعذّر التحميل: ${esc(error.message)}</p></div>`;
    return;
  }

  // نسخة واحدة لكل فريق: الأحدث
  const latest = new Map();
  (data || []).forEach(p => {
    const cur = latest.get(p.team_id);
    if(!cur || (p.version || 0) > (cur.version || 0)) latest.set(p.team_id, p);
  });
  allProjectsCache = [...latest.values()];

  const tracks = [...new Set(allProjectsCache
    .map(p => p.teams?.tracks?.name_ar).filter(Boolean))].sort();

  box.innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div class="ap-bar">
        <div class="field" style="margin:0;flex:1;min-width:190px">
          <label>بحث بالمشروع أو الفريق أو رقمه</label>
          <input id="ap-search" placeholder="اكتب للبحث..." oninput="filterAllProjects()">
        </div>
        <div class="field" style="margin:0;min-width:170px">
          <label>المسار</label>
          <select id="ap-track" onchange="filterAllProjects()">
            <option value="">كل المسارات</option>
            ${tracks.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}
          </select>
        </div>
      </div>
      <p class="hint" id="ap-count" style="margin:12px 0 0"></p>
    </div>
    <div id="ap-list"></div>`;

  filterAllProjects();
}

function filterAllProjects(){
  const term  = (document.getElementById("ap-search")?.value || "").trim().toLowerCase();
  const track = document.getElementById("ap-track")?.value || "";

  const shown = allProjectsCache.filter(p => {
    if(track && p.teams?.tracks?.name_ar !== track) return false;
    if(!term) return true;
    return (p.title || "").toLowerCase().includes(term)
        || (p.teams?.team_name || "").toLowerCase().includes(term)
        || (p.teams?.team_code || "").toLowerCase().includes(term);
  });

  const cnt = document.getElementById("ap-count");
  if(cnt) cnt.textContent = shown.length === allProjectsCache.length
    ? `${allProjectsCache.length} مشروعًا`
    : `${shown.length} من ${allProjectsCache.length}`;

  const list = document.getElementById("ap-list");
  if(!shown.length){
    list.innerHTML = `<div class="card"><div class="empty-state">لا مشاريع مطابقة</div></div>`;
    return;
  }

  list.innerHTML = shown.map(p => `
    <div class="card ap-card">
      <div class="ap-head">

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function jsArg(v){
  return JSON.stringify(v === undefined ? null : v).replace(/[&'<>]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4,"0"));
}
function fmtDate(d){
  if(!d) return "—";
  return new Date(d).toLocaleString("ar-SA", {dateStyle:"medium", timeStyle:"short"});
}

async function handleGateLogin(){
  const alertBox = document.getElementById("gate-alert");
  alertBox.className = "alert";
  const email = document.getElementById("gate-email").value.trim();
  const password = document.getElementById("gate-password").value;
  if(!email || !password){ alertBox.textContent = "أدخل البريد وكلمة المرور"; alertBox.className = "alert error"; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alertBox.textContent = "بيانات الدخول غير صحيحة"; alertBox.className = "alert error"; return; }

  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.user.id);
  const roleKeys = (roles||[]).map(r => r.roles?.key);
  if(!roleKeys.includes("mentor") && !roleKeys.includes("admin")){
    await sb.auth.signOut();
    alertBox.textContent = "هذا الحساب لا يملك صلاحية الإرشاد"; alertBox.className = "alert error";
    return;
  }

  // الإداري يتجاوز فحص التفعيل (يحتاج يدخل للمتابعة والتنظيف)
  if(!roleKeys.includes("admin") && !(await isAccountActive(data.user.id))){
    await sb.auth.signOut();
    alertBox.textContent = "حسابك كمرشد معطَّل حاليًا. للاستفسار تواصل مع فريق تنظيم البرنامج.";
    alertBox.className = "alert error";
    return;
  }

  currentUser = data.user;
  showContent();
}

// غير مسجّل → دخول أو تقديم · طلب معلّق → حالته · معتمَد → اللوحة.
async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(!data.session) return;

  const uid = data.session.user.id;
  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", uid);
  const keys = (roles || []).map(r => r.roles?.key);

  if(keys.includes("mentor") || keys.includes("admin")){
    currentUser = data.session.user;
    showContent();
    return;
  }

  // مسجّل بلا دور: نعرض حالة طلبه
  const { data: app } = await sb.from("mentor_applications")
    .select("status").eq("user_id", uid).maybeSingle();

  document.getElementById("gate-tabs").style.display = "none";
  document.getElementById("pane-login").style.display = "none";
  document.getElementById("pane-apply").style.display = "none";
  document.getElementById("pane-status").style.display = "block";

  document.getElementById("status-text").textContent =
    !app                      ? "لم يُسجَّل لكم طلب انضمام بعد. سجّلوا الخروج ثم قدّموا طلبًا جديدًا."
    : app.status === "pending"  ? "طلبكم قيد المراجعة من فريق التنظيم. سنُشعركم فور اعتماده."
    : app.status === "rejected" ? "نعتذر عن عدم إمكانية قبول طلبكم في هذه الدورة."
    : "طلبكم معتمد. إن لم تظهر لوحتكم، يرجى تسجيل الخروج والدخول من جديد.";
}
restoreSession();

async function submitApplication(){
  const mode = document.getElementById("ap-new").classList.contains("active") ? "new" : "existing";
  const spec = document.getElementById("ap-spec").value.trim();
  const bio  = document.getElementById("ap-bio").value.trim();
  const pos  = document.getElementById("ap-position").value.trim();

  if(!spec){ gateAlert("التخصص أو المجال مطلوب"); return; }

  let uid = null;

  if(mode === "new"){
    const name  = document.getElementById("ap-name").value.trim();
    const email = document.getElementById("ap-email").value.trim();
    const phone = document.getElementById("ap-phone").value.trim();
    const org   = document.getElementById("ap-org").value.trim();
    const pass  = document.getElementById("ap-password").value;

    if(!name || !email || !pass){ gateAlert("الاسم والبريد وكلمة المرور مطلوبة"); return; }
    if(pass.length < 6){ gateAlert("كلمة المرور يجب ألا تقل عن ستة أحرف"); return; }

    const { data, error } = await sb.auth.signUp({
      email, password: pass,
      options: { data: { full_name: name, phone, organization: org } }
    });
    if(error){
      gateAlert(error.message.includes("already")
        ? "هذا البريد مسجّل مسبقًا — استخدموا «لدي حساب»" : error.message);
      return;
    }
    if(!data.session){
      gateAlert("تحققوا من بريدكم لتأكيد الحساب، ثم عودوا واستخدموا «لدي حساب»", "success");
      return;
    }
    uid = data.user.id;
  } else {
    const email = document.getElementById("ap-login-email").value.trim();
    const pass  = document.getElementById("ap-login-password").value;
    if(!email || !pass){ gateAlert("البريد وكلمة المرور مطلوبان"); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ gateAlert("بيانات الدخول غير صحيحة"); return; }
    uid = data.user.id;
  }

  // من اعتُمد سابقًا لا يُعيد التقديم — إعادة الإرسال تُرجع الحالة
  // إلى pending فيفقد صلاحيته.
  const { data: myRoles } = await sb.from("user_roles").select("roles(key)").eq("user_id", uid);
  if((myRoles || []).some(r => r.roles?.key === "mentor")){
    gateAlert("حسابكم معتمد بالفعل — جارٍ فتح لوحتكم", "success");
    setTimeout(() => location.reload(), 1200);
    return;
  }

  // تعارض المصالح: عضو فريق لا يكون مرشدًا بنفس الحساب
  const { data: mem } = await sb.from("team_members").select("id").eq("user_id", uid).limit(1);
  if(mem && mem.length){
    gateAlert("هذا الحساب مسجَّل عضوًا بأحد الفرق. لمنع تعارض المصالح، استخدموا بريدًا مختلفًا");
    return;
  }

  if(pos) await sb.from("profiles").update({ current_position: pos }).eq("id", uid);

  const { error: appErr } = await sb.from("mentor_applications").upsert({
    user_id: uid, specialization: spec, bio: bio || null, status: "pending"
  }, { onConflict: "user_id" });

  if(appErr){ gateAlert("تعذّر إرسال الطلب: " + appErr.message); return; }

  gateAlert("تم إرسال طلبكم. سنُشعركم فور مراجعته", "success");
  setTimeout(() => location.reload(), 1600);
}

async function renderSlots(){
  const main = document.getElementById("main-content");
  main.innerHTML = `
    <div id="slots-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px"></div>
    <div class="subtabs" id="slot-filters"></div>
    <div class="card"><div id="slots-list">جارٍ التحميل...</div></div>`;

  const { data, error } = await sb.from("mentor_slots")
    .select("id, start_time, end_time, is_online, location, is_booked, mentor_bookings(id, team_id, status, requested_topic, held_at, teams(team_name, team_code, tracks(name_ar)))")
    .eq("mentor_user_id", currentUser.id)
    .order("start_time");

  const box = document.getElementById("slots-list");
  if(error){ box.innerHTML = `<div class="empty-state">خطأ: ${esc(error.message)}</div>`; return; }

  // إحصائيات سريعة — البند 4: عدد الجلسات المغلقة
  const now = new Date();

  // العدّادات من الوقت لا من status: الحالة تبقى confirmed بعد
  // انقضاء الموعد، والقديم كان يعدّ المنتهية ضمن «القادمة».
  // و«جلسات مغلقة» كانت صفرًا دائمًا بعد إلغاء زر الإغلاق.
  let cUpcoming = 0, cHeld = 0, cPending = 0, cFree = 0;
  data.forEach(sl => {
    const b  = (sl.mentor_bookings || [])[0];
    const en = new Date(sl.end_time);
    if(b && b.status === "cancelled") return;
    if(!b){ if(en > now) cFree++; return; }
    if(en > now)        cUpcoming++;
    else if(b.held_at)  cHeld++;
    else                cPending++;
  });

  document.getElementById("slots-stats").innerHTML = `
    <div class="stat-card"><div class="num">${cUpcoming}</div><div class="label">جلسات قادمة</div></div>
    <div class="stat-card"><div class="num" style="color:var(--teal)">${cHeld}</div><div class="label">تمت الاستشارة</div></div>
    <div class="stat-card"><div class="num" style="${cPending ? "color:var(--gold)" : ""}">${cPending}</div><div class="label">تنتظر تأكيدك</div></div>
    <div class="stat-card"><div class="num">${cFree}</div><div class="label">مواعيد متاحة</div></div>
  `;

  if(!data.length){ box.innerHTML = `<div class="empty-state">لا توجد مواعيد مضافة بعد — أضف موعدك الأول من التبويب الثاني</div>`; return; }

  const teamIds = [...new Set(data.map(s => (s.mentor_bookings||[])[0]?.team_id).filter(Boolean))];

  let submissionsByTeam = {};
  if(teamIds.length){
    const { data: submissions } = await sb.from("submissions")
      .select("team_id, title, description, file_url, version")
      .in("team_id", teamIds)
      .order("version", {ascending:false});
    (submissions||[]).forEach(s => {
      if(!submissionsByTeam[s.team_id]) submissionsByTeam[s.team_id] = s;
    });
  }

  // تقسيم زمني لا حسب الحالة: المرشد يفكّر بيومه لا بتصنيف
  // مواعيده. الجلسة المنتهية تبقى أمامه ليكتب ملاحظاتها، لكنها
  // لا تختلط بجلسات الأسبوع الماضي.
  const dayKey = d => new Date(d).toLocaleDateString("en-CA");   // YYYY-MM-DD محلي
  const today  = dayKey(now);

  // الجلسات (محجوزة + منتهية) معًا: المرشد يتابع فرقه في مكان
  // واحد، ويميّزها باللون. المواعيد الفارغة منفصلة لأنها إدارة
  // جدول لا متابعة فرق.
  const groupOf = s => {
    const b = (s.mentor_bookings||[])[0];
    if(b && b.status === "cancelled") return "cancelled";
    if(b) return b.held_at ? "done" : "sessions";   // المؤكَّدة تنتقل للمنجزة
    return new Date(s.end_time) <= now ? "expired" : "free";
  };
  const groups = { sessions: [], done: [], free: [], expired: [], cancelled: [] };
  data.forEach(s => groups[groupOf(s)].push(s));

  // الجلسات: القادمة أولًا ثم الأحدث انتهاءً
  groups.sessions.sort((a, b) => {
    const ea = new Date(a.end_time) <= now, eb = new Date(b.end_time) <= now;
    if(ea !== eb) return ea ? 1 : -1;                         // غير المنتهية أولًا
    return ea ? new Date(b.start_time) - new Date(a.start_time)
              : new Date(a.start_time) - new Date(b.start_time);
  });
  groups.done     .sort((a, b) => new Date(b.start_time) - new Date(a.start_time));
  groups.free     .sort((a, b) => new Date(a.start_time) - new Date(b.start_time));
  groups.expired  .sort((a, b) => new Date(b.start_time) - new Date(a.start_time));
  groups.cancelled.sort((a, b) => new Date(b.start_time) - new Date(a.start_time));

  const TABS = [
    ["sessions",  "الجلسات",            "calendar-check"],
    ["done",      "استشارات منجزة",     "circle-check"],
    ["free",      "مواعيد متاحة",       "calendar-plus"],
    ["expired",   "انتهت",              "calendar-x"],
    ["cancelled", "ملغاة",              "circle-slash"],
  ];
  if(!window._slotFilter || !TABS.some(t => t[0] === window._slotFilter)){
    window._slotFilter = TABS.find(t => groups[t[0]].length)?.[0] || "sessions";
  }

  document.getElementById("slot-filters").innerHTML = TABS.map(([k, label, icon]) => `
    <button class="subtab ${window._slotFilter === k ? "active" : ""}"
            onclick="setSlotFilter('${k}')">
      <i data-lucide="${icon}"></i> ${label}
      <span class="cnt">${groups[k].length}</span>
    </button>`).join("");

  const shown = groups[window._slotFilter] || [];
  if(!shown.length){
    box.innerHTML = `<div class="empty-state">لا مواعيد في هذه المجموعة</div>`;
    if(window.lucide) lucide.createIcons();
    return;
  }

  box.innerHTML = shown.map(s => {
    const booking = (s.mentor_bookings||[])[0];
    const _en = new Date(s.end_time), _st = new Date(s.start_time);
    const rowCls =
        (booking && booking.status === "cancelled") ? "sl-cancelled"
      : (_en <= now)  ? (booking ? "sl-done" : "sl-expired")
      : !booking      ? "sl-free"
      : (_st <= now)  ? "sl-live" : "sl-booked";
    const submission = booking ? submissionsByTeam[booking.team_id] : null;
    return `
    <div class="slot-row ${rowCls}">
      <div style="flex:1">
        <div class="slot-time"><i data-lucide="calendar-clock"></i> ${fmtDate(s.start_time)}</div>
        <div class="slot-meta">${esc(s.location || (s.is_online ? "عبر الإنترنت" : ""))}</div>
        ${booking ? `
          <div class="project-box">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:${booking.requested_topic || submission ? '10px' : '0'}">
              <strong style="color:var(--navy); font-size:13.5px">${esc(booking.teams?.team_name||"")}</strong>
              <code style="font-size:10.5px;color:var(--gold);background:#fbf3e2;padding:2px 8px;border-radius:6px">${esc(booking.teams?.team_code||"")}</code>
              <span style="color:var(--muted); font-size:12px">${esc(booking.teams?.tracks?.name_ar||"")}</span>
            </div>
            ${booking.requested_topic ? `
              <div style="margin-bottom:10px">
                <div style="font-size:11px; color:var(--muted); font-weight:600; margin-bottom:2px">الموضوع المطلوب</div>
                <div style="color:var(--ink); font-size:13px">${esc(booking.requested_topic)}</div>
              </div>
            ` : ""}
            ${submission ? `
              <details class="proj-fold">
                <summary><span class="row">
                  <i data-lucide="folder-open"></i>
                  <span class="t">${esc(submission.title)}</span>
                  <span class="more">عرض التفاصيل</span>
                </span></summary>
                <div class="proj-body">
                ${submission.description ? `<p style="margin:0 0 8px;color:var(--ink);line-height:1.7;font-size:12.5px">${esc(submission.description)}</p>` : `<p style="margin:0 0 8px;color:var(--muted);font-size:12.5px">لا يوجد وصف مضاف بعد</p>`}
                ${submission.file_url
                  ? `<a href="${esc(submission.file_url)}" target="_blank" style="color:var(--teal);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px"><i data-lucide="paperclip" style="width:13px;height:13px"></i> فتح ملف المشروع</a>`
                  : `<span style="color:var(--muted);font-size:12.5px">لا يوجد ملف مرفق</span>`}
              </div>
              </details>
            ` : `<div style="padding-top:10px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px">لم يقدّم الفريق مشروعه بعد</div>`}
          </div>
        ` : ""}
      </div>
      <div style="text-align:left">
        ${(() => {
          // الوقت يُفحص أولًا: الموعد الذي مضى وقته لم يعد متاحًا
          // للحجز حتى لو لم يحجزه أحد — كان يظهر «متاح» بالخطأ.
          const now = new Date(), en = new Date(s.end_time), st = new Date(s.start_time);
          if(booking && booking.status === "cancelled")
            return '<span class="badge badge-red">ملغاة</span>';
          if(en <= now){
            if(!booking) return '<span class="badge badge-gray">لم يتم حجزها</span>';
            // التأكيد يضيف معلومة، وغيابه لا يعطّل شيئًا
            return booking.held_at
              ? '<span class="badge badge-green">تمت الاستشارة</span>'
              : '<span class="badge badge-gray">لم تُؤكَّد</span>';
          }
          if(!booking) return '<span class="badge badge-teal">متاح للحجز</span>';
          if(st <= now)
            return booking.held_at
              ? '<span class="badge badge-gold">جارية الآن</span> <span class="badge badge-green">تمت الاستشارة</span>'
              : '<span class="badge badge-gold">جارية الآن</span>';
          return '<span class="badge badge-green">محجوزة</span>';
        })()}
        ${booking && booking.status === "pending" ? `<div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-primary btn-sm" onclick="confirmBooking('${booking.id}')">تأكيد الحجز</button><button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="cancelBookingByMentor('${booking.id}')">إلغاء</button></div>` : ""}

          </div>` : ""}

  }).join("");
  if(window.lucide) lucide.createIcons();
}
async function deleteSlot(slotId){

async function saveEditSlot(slotId){
  const date = document.getElementById("f-edit-date").value;
  const time = document.getElementById("f-edit-time").value;
  const duration = parseInt(document.getElementById("f-edit-duration").value);
  const location = document.getElementById("f-edit-location").value.trim();
  if(!date || !time){ alert("أدخل التاريخ والوقت"); return; }

  const start_time = new Date(`${date}T${time}`);
  const end_time = new Date(start_time.getTime() + duration*60000);

  const { error } = await sb.from("mentor_slots").update({
    start_time: start_time.toISOString(), end_time: end_time.toISOString(), location
  }).eq("id", slotId);
  if(error){ alert("خطأ: " + error.message); return; }
  closeModal();
  renderSlots();

async function cancelBookingByMentor(bookingId){

  const { error } = await sb.from("mentor_bookings").update({ status: "cancelled" }).eq("id", bookingId);
  if(error){
    // رسالة القاعدة الخام مربكة — نوضّح المقصود
    const msg = /يتداخل|overlap/.test(error.message)
      ? "تعذّر الإلغاء: يوجد موعدان متداخلان في جدولكم. تواصلوا مع الإدارة لحذف أحدهما."
      : "تعذّر الإلغاء: " + error.message;
    alert(msg);
    return;
  }
  renderSlots();
}

        (قبل 15 دقيقة من الموعد المحدد) — يتبقّى ${minsLeft > 60 ? Math.ceil(minsLeft/60) + ' ساعة تقريبًا' : minsLeft + ' دقيقة'}.

async function saveFeedback(bookingId, teamId, startTime){
  const alertBox = document.getElementById("fb-alert");
  alertBox.className = "alert";
  const notes = document.getElementById("fb-notes").value.trim();
  const readiness = parseInt(document.getElementById("fb-readiness").value);
  if(!notes){ alertBox.textContent = "الرجاء كتابة ملاحظاتك"; alertBox.className = "alert error"; return; }

  // تحقق مزدوج لحظة الحفظ (دفاع إضافي لو تأخر المستخدم بالنافذة المفتوحة لفترة طويلة قبل الضغط)
  const earliestAllowed = new Date(new Date(startTime).getTime() - 15*60000);
  if(new Date() < earliestAllowed){
    alertBox.textContent = "لم يحن وقت هذه الجلسة بعد — لا يمكن إنهاؤها إلا قبل الموعد بـ15 دقيقة كحد أقصى";
    alertBox.className = "alert error";
    return;
  }

  const { error: fbError } = await sb.from("mentor_feedback").insert({
    booking_id: bookingId, mentor_user_id: currentUser.id, team_id: teamId,
    notes, team_readiness_score: readiness
  });

  await sb.from("mentor_bookings").update({ status: "completed" }).eq("id", bookingId);

}

let cachedMentorshipWindow = null;
async function getMentorshipWindow(){
  if(cachedMentorshipWindow) return cachedMentorshipWindow;
  const [setRes, daysRes] = await Promise.all([
    sb.from("platform_settings").select("key,value").in("key",["mentorship_start_date","mentorship_end_date"]),
    sb.from("program_days").select("day_number, starts_at, ends_at").eq("phase","mentorship").order("day_number")
  ]);
  const map = {};
  (setRes.data||[]).forEach(r => map[r.key] = r.value);
  cachedMentorshipWindow = {
    start: map.mentorship_start_date || null,
    end: map.mentorship_end_date || null,
    days: daysRes.data || []
  };
  return cachedMentorshipWindow;
}
function validateWithinMentorshipWindow(startDate, endDate, win){
  // لو عُرِّفت أيام، الموعد لازم يقع بالكامل داخل يوم واحد منها
  if(win.days && win.days.length){
    const fits = win.days.some(d => startDate >= new Date(d.starts_at) && endDate <= new Date(d.ends_at));
    if(!fits){
      const list = win.days
        .map(d => `اليوم ${d.day_number}: ${fmtDate(d.starts_at)} → ${new Date(d.ends_at).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'})}`)
        .join(" · ");
      return `الموعد خارج أيام الإرشاد المحددة (${list})`;
    }
    return null;
  }
  if(win.start && startDate < new Date(win.start)){
    return `الموعد قبل بداية فترة الإرشاد المحددة (${fmtDate(win.start)})`;
  }
  if(win.end && endDate > new Date(win.end)){
    return `الموعد بعد نهاية فترة الإرشاد المحددة (${fmtDate(win.end)})`;
  }
  return null;
}
function generateTimeOptions(){
  const options = [];
  for(let h = 7; h <= 23; h++){
    for(let m = 0; m < 60; m += 15){
      if(h === 23 && m > 0) break;
      const hh = String(h).padStart(2,"0");
      const mm = String(m).padStart(2,"0");
      const period = h < 12 ? "ص" : "م";
      const h12 = h % 12 === 0 ? 12 : h % 12;
      options.push(`<option value="${hh}:${mm}">${h12}:${mm} ${period}</option>`);
    }
  }
  return options.join("");
}

        <select id="bulk-duration">
          <option value="15">15 دقيقة</option>
          <option value="30" selected>30 دقيقة</option>
          <option value="45">45 دقيقة</option>
          <option value="60">60 دقيقة</option>
        </select>
      </div>
      <div class="field"><label>فاصل بين الجلسات</label>
        <select id="bulk-gap">
          <option value="0">بدون فاصل</option>
          <option value="5" selected>5 دقائق</option>
          <option value="10">10 دقائق</option>
          <option value="15">15 دقيقة</option>
        </select>
      </div>
    </div>
    <div class="field"><label>المسار (اختياري)</label>
      <select id="bulk-track"><option value="">كل المسارات</option>
        ${(tracks||[]).map(t=>`<option value="${t.id}">${esc(t.name_ar)}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label><input type="checkbox" id="bulk-online" checked> جلسات عبر الإنترنت</label></div>
    <div class="field"><label>الموقع / رابط الاجتماع (يُطبَّق على كل الجلسات)</label><input id="bulk-location" placeholder="اختياري"></div>
    <div id="bulk-preview" class="hint" style="margin-bottom:10px"></div>
    <div id="bulk-alert" class="alert"></div>
    <button class="btn btn-primary" onclick="saveBulkSlots()">إضافة كل المواعيد</button>
  </div>`;

  ["bulk-date","bulk-start-time","bulk-end-time","bulk-duration","bulk-gap"].forEach(id => {
    document.getElementById(id).addEventListener("change", updateBulkPreview);
  });
}
function computeBulkSlots(){
  const date = document.getElementById("bulk-date").value;
  const startTime = document.getElementById("bulk-start-time").value;
  const endTime = document.getElementById("bulk-end-time").value;
  const duration = parseInt(document.getElementById("bulk-duration").value);
  const gap = parseInt(document.getElementById("bulk-gap").value);
  if(!date) return [];

  const rangeStart = new Date(`${date}T${startTime}:00`);
  const rangeEnd = new Date(`${date}T${endTime}:00`);
  const slots = [];
  let cursor = new Date(rangeStart);
  while(true){
    const slotEnd = new Date(cursor.getTime() + duration * 60000);
    if(slotEnd > rangeEnd) break;
    slots.push({ start: new Date(cursor), end: slotEnd });
    cursor = new Date(slotEnd.getTime() + gap * 60000);
  }
  return slots;
}
function updateBulkPreview(){
  const slots = computeBulkSlots();
  const box = document.getElementById("bulk-preview");
  if(!box) return;
  box.textContent = slots.length ? `سيتم إنشاء ${slots.length} موعد` : "حدّد نطاق وقت صحيح لعرض المعاينة";
}
async function saveBulkSlots(){
  const alertBox = document.getElementById("bulk-alert");
  alertBox.className = "alert";
  const slots = computeBulkSlots();
  if(!slots.length){ alertBox.textContent = "تأكد من التاريخ ونطاق الوقت"; alertBox.className = "alert error"; return; }
  if(slots[0].start < new Date()){ alertBox.textContent = "لا يمكن إضافة مواعيد بتاريخ/وقت ماضٍ"; alertBox.className = "alert error"; return; }

  const mentorshipWindow = await getMentorshipWindow();
  const lastSlot = slots[slots.length - 1];
  const windowError = validateWithinMentorshipWindow(slots[0].start, lastSlot.end, mentorshipWindow);
  if(windowError){ alertBox.textContent = windowError; alertBox.className = "alert error"; return; }

  const track_id = document.getElementById("bulk-track").value || null;
  const is_online = document.getElementById("bulk-online").checked;
  const location = document.getElementById("bulk-location").value.trim();

  const rows = slots.map(s => ({
    mentor_user_id: currentUser.id, start_time: s.start.toISOString(), end_time: s.end.toISOString(),
    track_id, is_online, location: location || null
  }));

  const { error } = await sb.from("mentor_slots").insert(rows);
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }

  alertBox.textContent = `تمت إضافة ${rows.length} موعد بنجاح`; alertBox.className = "alert success";
  setTimeout(() => {
    currentTab = "slots";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === "slots"));
    renderSlots();
  }, 1000);
}
async function saveNewSlot(){
  const alertBox = document.getElementById("add-slot-alert");
  alertBox.className = "alert";
  const date = document.getElementById("slot-date").value;
  const time = document.getElementById("slot-time").value;
  const duration = parseInt(document.getElementById("slot-duration").value);
  const track_id = document.getElementById("slot-track").value || null;
  const is_online = document.getElementById("slot-online").checked;
  const location = document.getElementById("slot-location").value.trim();

  if(!date){ alertBox.textContent = "حدّد تاريخ الموعد"; alertBox.className = "alert error"; return; }

  const startDate = new Date(`${date}T${time}:00`);
  const endDate = new Date(startDate.getTime() + duration * 60000);

  if(startDate < new Date()){
    alertBox.textContent = "لا يمكن إضافة موعد بتاريخ ماضٍ"; alertBox.className = "alert error"; return;
  }

  const mentorshipWindow = await getMentorshipWindow();
  const windowError = validateWithinMentorshipWindow(startDate, endDate, mentorshipWindow);
  if(windowError){ alertBox.textContent = windowError; alertBox.className = "alert error"; return; }

  const { error } = await sb.from("mentor_slots").insert({
    mentor_user_id: currentUser.id, start_time: startDate.toISOString(),
    end_time: endDate.toISOString(), track_id, is_online, location: location || null
  });
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }

  alertBox.textContent = "تمت إضافة الموعد بنجاح"; alertBox.className = "alert success";
  setTimeout(() => {
    currentTab = "slots";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === "slots"));
    renderSlots();
  }, 800);
}
</script>

<title>لوحة الإرشاد | هاكثون السيرة النبوية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --navy:#28323C; --navy-dark:#1B232B; --navy-light:#3A4754; --purple:#A67C00; --teal:#B8860B;
    --gold:#D9A400; --bg:#FEFAEC; --card:#FFFFFF; --ink:#1A1A2E; --muted:#6B7A99;
    --border:#E4E6EF; --border-light:#EEF0F5; --danger:#C0392B; --radius:14px;
  }
  body.dark{
    --bg:#161C22; --card:#1E262E; --ink:#EEF0F2; --muted:#8b96a8; --border:#2F3944; --border-light:#252E37;
  }
  body.dark .stat-card, body.dark .card{ color:var(--ink); }
  body.dark input, body.dark select, body.dark textarea{
    background:#1B232B !important; color:var(--ink) !important; border-color:var(--border) !important;
  }
  body.dark .slot-row{ background:var(--card); }
  body.dark .project-box{ background:#1B232B; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--bg); color:var(--ink);}

  header{background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 60%, #1B232B 100%); color:#fff; padding:22px 24px;}
  .header-row{max-width:900px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  header h1{font-size:18px; margin:0;}
  header p{margin:2px 0 0; font-size:12.5px; color:#B7BEC6;}
  .btn-link{background:none; border:none; color:#c8d3e8; cursor:pointer; font-size:12.5px; font-family:inherit;}

  main{max-width:900px; margin:0 auto; padding:24px;}
  .card{background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:22px; margin-bottom:18px;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--muted); font-size:13.5px;}

  .tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border);}
  .tab{padding:9px 4px; margin-left:20px; font-size:13.5px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-weight:500;}
  .tab.active{color:var(--teal); border-color:var(--teal);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; margin-bottom:6px; font-weight:500;}
  .field input, .field textarea, .field select{width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:9px; font-family:inherit; font-size:14px;}
  .form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .btn{border:none; border-radius:9px; padding:11px 20px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:#188878;}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--ink);}
  .btn-sm{padding:7px 14px; font-size:12.5px;}
  .alert{padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px; display:none;}
  .alert.error{background:#fdeceb; color:var(--danger); display:block;}
  .alert.success{background:#e6f7f3; color:var(--teal); display:block;}

  .auth-gate{max-width:400px; margin:20px auto 80px; text-align:center; background:var(--card); border-radius:var(--radius); padding:36px 28px; border:1px solid var(--border);}
  .auth-gate h2{margin-bottom:6px; color:var(--navy);}
  .auth-gate p{color:var(--muted); font-size:13.5px; margin-bottom:20px;}

  .slot-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;
    padding:18px 20px; margin-bottom:12px; background:#fff; border:1px solid var(--border); border-radius:14px;
    transition:.2s; box-shadow:0 1px 2px rgba(13,27,62,.03);
  }
  .slot-row:hover{box-shadow:0 6px 18px rgba(13,27,62,.08); border-color:rgba(40,50,60,.18);}
  .slot-row.is-booked{border-right:3px solid var(--gold);}
  .slot-time{font-size:14.5px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:6px;}
  .slot-time i{width:15px; height:15px; color:var(--gold);}
  .slot-meta{font-size:12px; color:var(--muted); margin-top:3px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge-gray{background:#f0f1f5; color:var(--muted);}
  .badge-green{background:#e6f7f3; color:var(--teal);}
  .badge-gold{background:#fbf3e2; color:var(--gold);}

  .project-box{background:var(--border-light); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-top:12px;}
  .stat-card{background:var(--border-light); border-radius:12px; padding:16px 18px; text-align:center;}
  .stat-card .num{font-size:24px; font-weight:700; color:var(--navy);}
  .stat-card .label{font-size:11.5px; color:var(--muted); margin-top:4px;}
  @media (max-width:600px){ img.hdr-logo{height:34px !important;} }
  .who-badge{width:38px; height:38px; border-radius:10px; background:#F7C30D; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.25);}
  .who-badge svg{width:20px; height:20px; color:#28323C; stroke-width:2.2;}
</style>

</head>

      <div style="display:flex;align-items:center;gap:12px"><span class="who-badge" aria-hidden="true"><i data-lucide="book-open-text"></i></span><div><h1 id="mentor-welcome">لوحة الإرشاد</h1><p>إدارة مواعيدك وملاحظاتك للفرق</p></div></div>
      <div style="display:flex;align-items:center;gap:10px">
        <button id="theme-toggle" onclick="toggleTheme()" title="تبديل الوضع الداكن/الفاتح" style="background:none;border:1px solid rgba(255,255,255,.25);border-radius:8px;width:32px;height:32px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center"><i data-lucide="moon" style="width:15px;height:15px"></i></button>
        <button class="btn-link" onclick="handleLogout()">تسجيل الخروج</button>
      </div>
    </div>
  </header>
  <main>
    <div class="tabs" id="tabs-bar">
      <div class="tab active" data-t="slots"><i data-lucide="calendar-clock" style="width:14px;height:14px;vertical-align:-2px"></i> مواعيدي</div>
      <div class="tab" data-t="add"><i data-lucide="calendar-plus" style="width:14px;height:14px;vertical-align:-2px"></i> إضافة موعد جديد</div>
      <div class="tab" data-t="bulk"><i data-lucide="calendar-range" style="width:14px;height:14px;vertical-align:-2px"></i> إضافة مواعيد بالجملة</div>
      <div class="tab" data-t="profile"><i data-lucide="user-round" style="width:14px;height:14px;vertical-align:-2px"></i> ملفي الشخصي</div>
      <div class="tab" data-t="certs"><i data-lucide="award" style="width:14px;height:14px;vertical-align:-2px"></i> شهاداتي</div>
    </div>
    <div id="main-content">جاري التحميل...</div>
  </main>
</div>

<div id="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(11,19,38,.5); align-items:center; justify-content:center; z-index:100; padding:20px;">
  <div id="modal-box" style="background:#fff; border-radius:14px; padding:24px; width:100%; max-width:440px;"></div>
</div>

<script>
const SUPABASE_URL = window.SEERA_CONFIG.SUPABASE_URL;
const SUPABASE_ANON_KEY = window.SEERA_CONFIG.SUPABASE_ANON_KEY;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentTab = "slots";

function esc(str){
  if(str === null || str === undefined) return "";
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function jsArg(v){
  return JSON.stringify(v === undefined ? null : v).replace(/[&'<>]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4,"0"));
}
function fmtDate(d){
  if(!d) return "—";
  return new Date(d).toLocaleString("ar-SA", {dateStyle:"medium", timeStyle:"short"});
}
function openModal(html){
  document.getElementById("modal-box").innerHTML = html;
  document.getElementById("modal-overlay").style.display = "flex";
}
function closeModal(){ document.getElementById("modal-overlay").style.display = "none"; }
document.getElementById("modal-overlay").addEventListener("click", e => { if(e.target.id === "modal-overlay") closeModal(); });

async function handleGateLogin(){
  const alertBox = document.getElementById("gate-alert");
  alertBox.className = "alert";
  const email = document.getElementById("gate-email").value.trim();
  const password = document.getElementById("gate-password").value;
  if(!email || !password){ alertBox.textContent = "أدخل البريد وكلمة المرور"; alertBox.className = "alert error"; return; }

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alertBox.textContent = "بيانات الدخول غير صحيحة"; alertBox.className = "alert error"; return; }

  const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.user.id);
  const roleKeys = (roles||[]).map(r => r.roles?.key);
  if(!roleKeys.includes("mentor") && !roleKeys.includes("admin")){
    await sb.auth.signOut();
    alertBox.textContent = "هذا الحساب لا يملك صلاحية الإرشاد"; alertBox.className = "alert error";
    return;
  }
  currentUser = data.user;
  showContent();
}
function toggleTheme(){
  const isDark = document.body.classList.toggle("dark");
  document.getElementById("theme-toggle").innerHTML = isDark
    ? '<i data-lucide="sun" style="width:15px;height:15px"></i>'
    : '<i data-lucide="moon" style="width:15px;height:15px"></i>';
  if(window.lucide) lucide.createIcons();
  localStorage.setItem("seera-theme", isDark ? "dark" : "light");
}
if(localStorage.getItem("seera-theme") === "dark"){
  document.body.classList.add("dark");
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("theme-toggle");
    if(btn) btn.innerHTML = '<i data-lucide="sun" style="width:15px;height:15px"></i>';
  });
}
async function handleLogout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById("content-screen").style.display = "none";
  document.getElementById("auth-gate-screen").style.display = "block";
}
async function restoreSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    const { data: roles } = await sb.from("user_roles").select("roles(key)").eq("user_id", data.session.user.id);
    const roleKeys = (roles||[]).map(r => r.roles?.key);
    if(roleKeys.includes("mentor") || roleKeys.includes("admin")){
      currentUser = data.session.user;
      showContent();
    }
  }
}
restoreSession();

async function showContent(){
  document.getElementById("auth-gate-screen").style.display = "none";
  document.getElementById("content-screen").style.display = "block";
  if(window.lucide){
    lucide.createIcons();
    const observer = new MutationObserver(() => {
      clearTimeout(window._lucideDebounce);
      window._lucideDebounce = setTimeout(() => lucide.createIcons(), 60);
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
  document.getElementById("tabs-bar").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if(!tab) return;
    currentTab = tab.dataset.t;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === currentTab));
    renderTab();
  });
  const { data: profile } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).maybeSingle();
  document.getElementById("mentor-welcome").textContent = "مرحبًا، " + (profile?.full_name || currentUser.email);
  renderTab();
}
function renderTab(){
  if(currentTab === "slots") renderSlots();
  else if(currentTab === "add") renderAddSlot();
  else if(currentTab === "bulk") renderBulkAddSlots();
  else if(currentTab === "certs") renderMentorCertsTab();
  else renderMyProfile();
}

/* ---------------- شهاداتي ---------------- */
async function renderMentorCertsTab(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div class="card">جاري التحميل...</div>`;

  const { data: types, error } = await sb.from("certificate_types").select("*").eq("is_active", true).or("role_key.eq.mentor,role_key.is.null");
  if(error){ main.innerHTML = `<div class="card"><p class="hint">خطأ: ${esc(error.message)}</p></div>`; return; }
  if(!types || !types.length){ main.innerHTML = `<div class="card"><h3>شهاداتي</h3><p class="hint">لا توجد شهادات متاحة لفئة المرشدين بعد</p></div>`; return; }

  const { data: myCerts } = await sb.from("certificates").select("cert_type_id, verification_code, issued_at").eq("user_id", currentUser.id);
  const issuedMap = {};
  (myCerts||[]).forEach(c => issuedMap[c.cert_type_id] = c);

  main.innerHTML = `<div class="card"><h3 style="margin:0 0 14px">شهاداتي</h3>
    ${types.map(t => {
      const issued = issuedMap[t.id];
      return `<div class="member-row">
        <span>${esc(t.name_ar)}</span>
        <span style="display:flex;align-items:center;gap:8px">
          ${issued
            ? `<span class="badge badge-green">صادرة</span><button class="btn-link" style="font-size:12px" onclick='previewMentorCert(${jsArg({name: "", typeName: t.name_ar, text: t.certificate_text, code: issued.verification_code, date: issued.issued_at})})'>معاينة</button>`
            : `<button class="btn btn-outline btn-sm" style="width:auto" onclick="issueMentorCertificate('${t.key}')">إصدار الشهادة</button>`}
        </span>
      </div>`;
    }).join("")}
  </div>`;
}
async function issueMentorCertificate(certKey){
  const { data, error } = await sb.rpc("issue_certificate", { p_cert_type_key: certKey });
  if(error){ alert("خطأ: " + error.message); return; }
  if(!data.success){ alert("لم تكتمل الشروط بعد لإصدار هذه الشهادة"); return; }
  renderMentorCertsTab();
}
async function previewMentorCert({typeName, text, code, date}){
  const { data: p } = await sb.from("profiles").select("full_name").eq("id", currentUser.id).single();
  SeeraCert.open({ name: p?.full_name || "", typeName, text, roleKey: "mentor", code, date });
}

/* ---------------- ملفي الشخصي ---------------- */
async function renderMyProfile(){
  const main = document.getElementById("main-content");
  const { data: profile } = await sb.from("profiles").select("*").eq("id", currentUser.id).single();
  const specOptions = ["السيرة النبوية والدراسات الإسلامية","التاريخ والتراث والتوثيق","التربية والتعليم","الإعلام والتواصل","الذكاء الاصطناعي وتعلم الآلة","تطوير البرمجيات والتطبيقات","تجربة المستخدم وتصميم المنتجات","الإنتاج الرقمي والمحتوى والرسوم المتحركة","الواقع المعزز والافتراضي والألعاب","ريادة الأعمال وإدارة المشاريع","أخرى"];
  const domainOptions = ["أكاديمي / جامعي","قطاع حكومي","قطاع ديني / دعوي / وقفي","قطاع خاص / شركات تقنية","ريادة أعمال / تأسيس شركات","أخرى"];
  const [savedSpec, savedDomain] = (profile.specialization||"").split(" — ");
  main.innerHTML = `<div class="card">
    <h3 style="margin:0 0 16px">ملفي الشخصي</h3>
    <div class="field"><label>الاسم الكامل</label><input value="${esc(profile.full_name||"")}" disabled style="opacity:.6"></div>
    <div class="field"><label>التخصص</label>
      <select id="profile-spec">
        <option value="">اختر التخصص</option>
        ${specOptions.map(o => `<option value="${esc(o)}" ${savedSpec===o?"selected":""}>${esc(o)}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>المجال</label>
      <select id="profile-domain">
        <option value="">اختر المجال</option>
        ${domainOptions.map(o => `<option value="${esc(o)}" ${savedDomain===o?"selected":""}>${esc(o)}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>المسمى الوظيفي / جهة العمل الحالية</label><input id="profile-position" value="${esc(profile.current_position||"")}" placeholder="مثال: مهندس برمجيات أول، شركة كذا"></div>
    <div class="field"><label>نبذة تعريفية</label><textarea id="profile-bio" rows="4" placeholder="خبرتك ذات الصلة بالبرنامج...">${esc(profile.bio||"")}</textarea></div>
    <div id="profile-alert" class="alert"></div>
    <button class="btn btn-primary" onclick="saveMyProfile()">حفظ التعديلات</button>
  </div>`;
}
async function saveMyProfile(){
  const alertBox = document.getElementById("profile-alert");
  alertBox.className = "alert";
  const specValue = document.getElementById("profile-spec").value;
  const domainValue = document.getElementById("profile-domain").value;
  const specialization = specValue + (domainValue ? " — " + domainValue : "");
  const current_position = document.getElementById("profile-position").value.trim();
  const bio = document.getElementById("profile-bio").value.trim();
  const { error } = await sb.from("profiles").update({ specialization, current_position, bio }).eq("id", currentUser.id);
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }
  alertBox.textContent = "تم الحفظ بنجاح"; alertBox.className = "alert success";
}

/* ---------------- مواعيدي ---------------- */
async function renderSlots(){
  const main = document.getElementById("main-content");
  main.innerHTML = `<div id="bulk-close-box"></div>
    <div id="slots-stats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px"></div>
    <div class="card"><div id="slots-list">جاري التحميل...</div></div>`;

  const { data, error } = await sb.from("mentor_slots")
    .select("id, start_time, end_time, is_online, location, is_booked, mentor_bookings(id, team_id, status, requested_topic, teams(team_name, team_code, tracks(name_ar)))")
    .eq("mentor_user_id", currentUser.id)
    .order("start_time");

  const box = document.getElementById("slots-list");
  if(error){ box.innerHTML = `<div class="empty-state">خطأ: ${esc(error.message)}</div>`; return; }

  // إحصائيات سريعة — البند 4: عدد الجلسات المغلقة
  const allBookings = data.flatMap(s => s.mentor_bookings || []);
  const closedCount = allBookings.filter(b => b.status === "completed").length;
  const upcomingCount = allBookings.filter(b => b.status === "confirmed" && data.find(s => (s.mentor_bookings||[])[0]?.id === b.id && new Date(s.end_time) > new Date())).length;
  document.getElementById("slots-stats").innerHTML = `
    <div class="stat-card"><div class="num">${data.length}</div><div class="label">إجمالي المواعيد</div></div>
    <div class="stat-card"><div class="num">${allBookings.filter(b=>b.status==="confirmed"||b.status==="pending").length}</div><div class="label">قادمة / بانتظار التأكيد</div></div>
    <div class="stat-card"><div class="num" style="color:var(--teal)">${closedCount}</div><div class="label">جلسات مغلقة</div></div>
  `;

  // زر الإقفال الجماعي — يشمل فقط الجلسات المؤكدة التي تجاوزت وقت نهايتها فعليًا
  const now = new Date();
  window._endedUnclosedBookings = data
    .filter(s => (s.mentor_bookings||[])[0]?.status === "confirmed" && new Date(s.end_time) < now)
    .map(s => ({
      bookingId: s.mentor_bookings[0].id,
      teamId: s.mentor_bookings[0].team_id,
      teamName: s.mentor_bookings[0].teams?.team_name || "",
      endTime: s.end_time
    }));
  const bulkBox = document.getElementById("bulk-close-box");
  if(window._endedUnclosedBookings.length){
    bulkBox.innerHTML = `<div class="card" style="border-color:var(--gold);background:#fbf3e2;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="font-size:13.5px"><strong>${window._endedUnclosedBookings.length}</strong> جلسة انتهى وقتها ولسا ما أُقفلت — أقفلها دفعة واحدة قبل ما تبدأ يوم جديد</div>
      <button class="btn btn-primary btn-sm" onclick="openBulkCloseModal()">إقفال كل الجلسات المنتهية</button>
    </div>`;
  } else {
    bulkBox.innerHTML = "";
  }

  if(!data.length){ box.innerHTML = `<div class="empty-state">لا توجد مواعيد مضافة بعد — أضف موعدك الأول من التبويب الثاني</div>`; return; }

  const teamIds = [...new Set(data.map(s => (s.mentor_bookings||[])[0]?.team_id).filter(Boolean))];
  let submissionsByTeam = {};
  if(teamIds.length){
    const { data: submissions } = await sb.from("submissions")
      .select("team_id, title, description, file_url, version")
      .in("team_id", teamIds)
      .order("version", {ascending:false});
    (submissions||[]).forEach(s => {
      if(!submissionsByTeam[s.team_id]) submissionsByTeam[s.team_id] = s;
    });
  }

  box.innerHTML = data.map(s => {
    const booking = (s.mentor_bookings||[])[0];
    const submission = booking ? submissionsByTeam[booking.team_id] : null;
    return `
    <div class="slot-row ${booking ? 'is-booked' : ''}">
      <div style="flex:1">
        <div class="slot-time"><i data-lucide="calendar-clock"></i> ${fmtDate(s.start_time)}</div>
        <div class="slot-meta">${esc(s.location || (s.is_online ? "عبر الإنترنت" : ""))}</div>
        ${booking ? `
          <div class="project-box">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:${booking.requested_topic || submission ? '10px' : '0'}">
              <strong style="color:var(--navy); font-size:13.5px">${esc(booking.teams?.team_name||"")}</strong>
              <code style="font-size:10.5px;color:var(--gold);background:#fbf3e2;padding:2px 8px;border-radius:6px">${esc(booking.teams?.team_code||"")}</code>
              <span style="color:var(--muted); font-size:12px">${esc(booking.teams?.tracks?.name_ar||"")}</span>
            </div>
            ${booking.requested_topic ? `
              <div style="margin-bottom:10px">
                <div style="font-size:11px; color:var(--muted); font-weight:600; margin-bottom:2px">الموضوع المطلوب</div>
                <div style="color:var(--ink); font-size:13px">${esc(booking.requested_topic)}</div>
              </div>
            ` : ""}
            ${submission ? `
              <div style="padding-top:10px; border-top:1px solid var(--border)">
                <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px">
                  <i data-lucide="folder-open" style="width:14px;height:14px;color:var(--gold)"></i>
                  <strong style="color:var(--navy); font-size:13px">${esc(submission.title)}</strong>
                </div>
                ${submission.description ? `<p style="margin:0 0 8px;color:var(--ink);line-height:1.7;font-size:12.5px">${esc(submission.description)}</p>` : `<p style="margin:0 0 8px;color:var(--muted);font-size:12.5px">لا يوجد وصف مضاف بعد</p>`}
                ${submission.file_url
                  ? `<a href="${esc(submission.file_url)}" target="_blank" style="color:var(--teal);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px"><i data-lucide="paperclip" style="width:13px;height:13px"></i> فتح ملف المشروع</a>`
                  : `<span style="color:var(--muted);font-size:12.5px">لا يوجد ملف مرفق</span>`}
              </div>
            ` : `<div style="padding-top:10px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px">لم يقدّم الفريق مشروعه بعد</div>`}
          </div>
        ` : ""}
      </div>
      <div style="text-align:left">
        ${!booking ? '<span class="badge badge-gray">غير محجوز</span>' :
          booking.status === "completed" ? '<span class="badge badge-green">✓ جلسة مغلقة</span>' :
          booking.status === "no_show_team" ? '<span class="badge badge-red">لم يحضر الفريق</span>' :
          booking.status === "no_show_mentor" ? '<span class="badge badge-red">لم تحضر (مسجَّل من الفريق)</span>' :
          booking.status === "confirmed" ? '<span class="badge badge-gold">مؤكد</span>' :
          '<span class="badge badge-gray">قيد الانتظار — بانتظار تأكيدك</span>'}
        ${booking && booking.status === "pending" ? `<div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-primary btn-sm" onclick="confirmBooking('${booking.id}')">تأكيد الحجز</button><button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="cancelBookingByMentor('${booking.id}')">إلغاء</button></div>` : ""}
        ${booking && booking.status === "confirmed" ? `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
            <button class="btn btn-outline btn-sm" onclick='openFeedbackModal(${jsArg({bookingId: booking.id, teamId: booking.team_id, teamName: booking.teams?.team_name, startTime: s.start_time, endTime: s.end_time})})'>✓ إنهاء الجلسة + ملاحظات</button>
            <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="markNoShow('${booking.id}','no_show_team')">لم يحضر الفريق</button>
            <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="cancelBookingByMentor('${booking.id}')">إلغاء الحجز</button>
          </div>` : ""}
        ${!booking ? `<div style="margin-top:8px;display:flex;gap:6px;justify-content:flex-end">
            <button class="btn btn-outline btn-sm" onclick='openEditSlotModal(${jsArg({id:s.id, start_time:s.start_time, end_time:s.end_time, is_online:s.is_online, location:s.location})})'>تعديل</button>
            <button class="btn btn-outline btn-sm" style="color:var(--danger)" onclick="deleteSlot('${s.id}')">حذف الموعد</button>
          </div>` : ""}
      </div>
    </div>`;
  }).join("");
  if(window.lucide) lucide.createIcons();
}
async function deleteSlot(slotId){
  if(!confirm("هل أنت متأكد من حذف هذا الموعد؟ لا يمكن حذفه إلا إذا كان غير محجوز.")) return;
  const { error } = await sb.from("mentor_slots").delete().eq("id", slotId);
  if(error){ alert("خطأ: " + error.message); return; }
  renderSlots();
}
function openEditSlotModal(slot){
  const start = new Date(slot.start_time);
  const dateStr = start.toISOString().slice(0,10);
  const timeStr = start.toTimeString().slice(0,5);
  const durationMin = Math.round((new Date(slot.end_time) - start) / 60000);
  openModal(`
    <h3>تعديل الموعد</h3>
    <div class="field"><label>التاريخ</label><input type="date" id="f-edit-date" value="${dateStr}"></div>
    <div class="field"><label>وقت البداية</label><input type="time" id="f-edit-time" value="${timeStr}"></div>
    <div class="field"><label>المدة (دقيقة)</label>
      <select id="f-edit-duration">
        ${[15,30,45,60].map(d=>`<option value="${d}" ${d===durationMin?"selected":""}>${d} دقيقة</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>الموقع / رابط اللقاء</label><input id="f-edit-location" value="${esc(slot.location||"")}"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveEditSlot('${slot.id}')">حفظ</button>
    </div>
  `);
}

  if(!canClose){
    const minsLeft = Math.ceil((earliestAllowed - now) / 60000);
    openModal(`
      <h3 style="margin:0 0 4px">لا يمكن إنهاء الجلسة الآن</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 18px">فريق: ${esc(teamName)}</p>

        (قبل 15 دقيقة من الموعد المحدد) — يتبقّى ${minsLeft > 60 ? Math.ceil(minsLeft/60) + ' ساعة تقريبًا' : minsLeft + ' دقيقة'}.
      </div>
      <div style="display:flex; gap:10px; margin-top:16px">

    <p style="color:var(--muted);font-size:13px;margin:0 0 18px">فريق: ${esc(teamName)}</p>

        <option value="4">٤</option>
        <option value="5">٥ — جاهز جدًا</option>
      </select>
    </div>
    <div id="fb-alert" class="alert"></div>
    <div style="display:flex; gap:10px">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">إلغاء</button>

function openBulkCloseModal(){
  const list = window._endedUnclosedBookings || [];
  if(!list.length){ closeModal(); return; }
  openModal(`

    </div>

      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">إلغاء</button>

    </div>

async function confirmBulkClose(){
  const alertBox = document.getElementById("bulk-fb-alert");
  alertBox.className = "alert";
  const notes = document.getElementById("bulk-fb-notes").value.trim() || "تم إقفال الجلسة ضمن إقفال جماعي لجلسات اليوم المنتهية";
  const list = window._endedUnclosedBookings || [];
  const now = new Date();

  // إعادة تحقق أخير (دفاعي): نستبعد أي جلسة ما انتهت وقتها فعليًا لو تغيّرت الحالة أثناء فتح النافذة
  const stillValid = list.filter(b => new Date(b.endTime) < now);

  let successCount = 0, failCount = 0;
  for(const b of stillValid){
    const { error: fbError } = await sb.from("mentor_feedback").insert({
      booking_id: b.bookingId, mentor_user_id: currentUser.id, team_id: b.teamId,
      notes, team_readiness_score: 3
    });
    if(fbError){ failCount++; continue; }
    const { error: upError } = await sb.from("mentor_bookings").update({ status: "completed" }).eq("id", b.bookingId);
    if(upError){ failCount++; } else { successCount++; }
  }

  if(failCount === 0){
    closeModal();
  } else {
    alertBox.textContent = `تم إقفال ${successCount} جلسة، وفشل ${failCount} — حاول تقفلها فرديًا من القائمة`;
    alertBox.className = "alert error";
  }
  renderSlots();
}
async function saveFeedback(bookingId, teamId, startTime){
  const alertBox = document.getElementById("fb-alert");
  alertBox.className = "alert";
  const notes = document.getElementById("fb-notes").value.trim();
  const readiness = parseInt(document.getElementById("fb-readiness").value);
  if(!notes){ alertBox.textContent = "الرجاء كتابة ملاحظاتك"; alertBox.className = "alert error"; return; }

  // تحقق مزدوج لحظة الحفظ (دفاع إضافي لو تأخر المستخدم بالنافذة المفتوحة لفترة طويلة قبل الضغط)
  const earliestAllowed = new Date(new Date(startTime).getTime() - 15*60000);
  if(new Date() < earliestAllowed){
    alertBox.textContent = "لم يحن وقت هذه الجلسة بعد — لا يمكن إنهاؤها إلا قبل الموعد بـ15 دقيقة كحد أقصى";
    alertBox.className = "alert error";
    return;
  }

  const { error: fbError } = await sb.from("mentor_feedback").insert({
    booking_id: bookingId, mentor_user_id: currentUser.id, team_id: teamId,
    notes, team_readiness_score: readiness
  });
  if(fbError){ alertBox.textContent = "خطأ: " + fbError.message; alertBox.className = "alert error"; return; }

  await sb.from("mentor_bookings").update({ status: "completed" }).eq("id", bookingId);
  closeModal();
  renderSlots();
}

let cachedMentorshipWindow = null;
async function getMentorshipWindow(){
  if(cachedMentorshipWindow) return cachedMentorshipWindow;
  const { data } = await sb.from("platform_settings").select("key,value").in("key",["mentorship_start_date","mentorship_end_date"]);
  const map = {};
  (data||[]).forEach(r => map[r.key] = r.value);
  cachedMentorshipWindow = { start: map.mentorship_start_date || null, end: map.mentorship_end_date || null };
  return cachedMentorshipWindow;
}
function validateWithinMentorshipWindow(startDate, endDate, win){
  if(win.start && startDate < new Date(win.start)){
    return `الموعد قبل بداية فترة الإرشاد المحددة (${fmtDate(win.start)})`;
  }
  if(win.end && endDate > new Date(win.end)){
    return `الموعد بعد نهاية فترة الإرشاد المحددة (${fmtDate(win.end)})`;
  }
  return null;
}
function generateTimeOptions(){
  const options = [];
  for(let h = 7; h <= 23; h++){
    for(let m = 0; m < 60; m += 15){
      if(h === 23 && m > 0) break;
      const hh = String(h).padStart(2,"0");
      const mm = String(m).padStart(2,"0");
      const period = h < 12 ? "ص" : "م";
      const h12 = h % 12 === 0 ? 12 : h % 12;
      options.push(`<option value="${hh}:${mm}">${h12}:${mm} ${period}</option>`);
    }
  }
  return options.join("");
}

  </div>`;

function computeBulkSlots(){
  const date = document.getElementById("bulk-date").value;
  const startTime = document.getElementById("bulk-start-time").value;
  const endTime = document.getElementById("bulk-end-time").value;
  const duration = parseInt(document.getElementById("bulk-duration").value);
  const gap = parseInt(document.getElementById("bulk-gap").value);
  if(!date) return [];

  const rangeStart = new Date(`${date}T${startTime}:00`);
  const rangeEnd = new Date(`${date}T${endTime}:00`);
  const slots = [];
  let cursor = new Date(rangeStart);
  while(true){
    const slotEnd = new Date(cursor.getTime() + duration * 60000);
    if(slotEnd > rangeEnd) break;
    slots.push({ start: new Date(cursor), end: slotEnd });
    cursor = new Date(slotEnd.getTime() + gap * 60000);
  }
  return slots;
}
function updateBulkPreview(){
  const slots = computeBulkSlots();
  const box = document.getElementById("bulk-preview");
  if(!box) return;
  box.textContent = slots.length ? `سيتم إنشاء ${slots.length} موعد` : "حدّد نطاق وقت صحيح لعرض المعاينة";
}
async function saveBulkSlots(){
  const alertBox = document.getElementById("bulk-alert");
  alertBox.className = "alert";
  const slots = computeBulkSlots();
  if(!slots.length){ alertBox.textContent = "تأكد من التاريخ ونطاق الوقت"; alertBox.className = "alert error"; return; }
  if(slots[0].start < new Date()){ alertBox.textContent = "لا يمكن إضافة مواعيد بتاريخ/وقت ماضٍ"; alertBox.className = "alert error"; return; }

  const mentorshipWindow = await getMentorshipWindow();
  const lastSlot = slots[slots.length - 1];
  const windowError = validateWithinMentorshipWindow(slots[0].start, lastSlot.end, mentorshipWindow);
  if(windowError){ alertBox.textContent = windowError; alertBox.className = "alert error"; return; }

  const track_id = document.getElementById("bulk-track").value || null;
  const is_online = document.getElementById("bulk-online").checked;
  const location = document.getElementById("bulk-location").value.trim();

  const rows = slots.map(s => ({
    mentor_user_id: currentUser.id, start_time: s.start.toISOString(), end_time: s.end.toISOString(),
    track_id, is_online, location: location || null
  }));

  const { error } = await sb.from("mentor_slots").insert(rows);
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }

  alertBox.textContent = `تمت إضافة ${rows.length} موعد بنجاح`; alertBox.className = "alert success";
  setTimeout(() => {
    currentTab = "slots";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === "slots"));
    renderSlots();
  }, 1000);
}
async function saveNewSlot(){
  const alertBox = document.getElementById("add-slot-alert");
  alertBox.className = "alert";
  const date = document.getElementById("slot-date").value;
  const time = document.getElementById("slot-time").value;
  const duration = parseInt(document.getElementById("slot-duration").value);
  const track_id = document.getElementById("slot-track").value || null;
  const is_online = document.getElementById("slot-online").checked;
  const location = document.getElementById("slot-location").value.trim();

  if(!date){ alertBox.textContent = "حدّد تاريخ الموعد"; alertBox.className = "alert error"; return; }

  const startDate = new Date(`${date}T${time}:00`);
  const endDate = new Date(startDate.getTime() + duration * 60000);

  if(startDate < new Date()){
    alertBox.textContent = "لا يمكن إضافة موعد بتاريخ ماضٍ"; alertBox.className = "alert error"; return;
  }

  const mentorshipWindow = await getMentorshipWindow();
  const windowError = validateWithinMentorshipWindow(startDate, endDate, mentorshipWindow);
  if(windowError){ alertBox.textContent = windowError; alertBox.className = "alert error"; return; }

  const { error } = await sb.from("mentor_slots").insert({
    mentor_user_id: currentUser.id, start_time: startDate.toISOString(),
    end_time: endDate.toISOString(), track_id, is_online, location: location || null
  });
  if(error){ alertBox.textContent = "خطأ: " + error.message; alertBox.className = "alert error"; return; }

  alertBox.textContent = "تمت إضافة الموعد بنجاح"; alertBox.className = "alert success";
  setTimeout(() => {
    currentTab = "slots";
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.t === "slots"));
    renderSlots();
  }, 800);
}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإرشاد — هاكثون السيرة النبوية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  :root{
    --navy:#28323C; --navy2:#3A4754; --teal:#B8860B; --teal-l:#F7C30D;
    --gold:#D9A400; --ink:#E8F1F8; --muted:#8FA6BC;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--navy); color:var(--ink);
    font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  /* هالات خلفية تعطي عمقًا للشاشة الكبيرة */
  body::before,body::after{
    content:""; position:fixed; border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle,rgba(217,164,0,.10) 0%,transparent 70%);
  }
  body::before{width:900px;height:900px;top:-380px;inset-inline-start:-260px}
  body::after{width:760px;height:760px;bottom:-340px;inset-inline-end:-220px;
    background:radial-gradient(circle,rgba(217,164,0,.06) 0%,transparent 70%)}

  .wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:30px 34px 46px}

  /* ---- الرأس ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.10);margin-bottom:34px}
  .orgs{display:flex;align-items:center}
  .orgs img{height:46px;width:auto;display:block;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
  .orgs .sep{width:1px;height:34px;background:rgba(255,255,255,.24);margin:0 20px;flex-shrink:0}
  .live{display:flex;align-items:center;gap:9px;white-space:nowrap;font-size:14px;font-weight:600;
    color:var(--teal-l);background:rgba(217,164,0,.12);border:1px solid rgba(217,164,0,.34);
    padding:9px 20px;border-radius:999px}
  .dot{width:9px;height:9px;margin-left:9px;margin-inline-end:9px;flex-shrink:0;border-radius:50%;background:var(--teal);
    box-shadow:0 0 0 0 rgba(217,164,0,.7);animation:ping 2s infinite}
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(217,164,0,.6)}
    70%{box-shadow:0 0 0 13px rgba(217,164,0,0)}
    100%{box-shadow:0 0 0 0 rgba(217,164,0,0)}
  }

  .hero{display:flex;align-items:center;gap:26px;margin-bottom:40px}
  .hero .mark{margin-left:26px;margin-inline-end:26px}
  .hero .mark{width:104px;height:104px;border-radius:24px;overflow:hidden;flex-shrink:0;
    box-shadow:0 0 52px rgba(217,164,0,.22)}
  .hero .mark img{width:100%;height:100%;object-fit:contain;display:block}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .hero h1{margin:0;font-size:40px;font-weight:800;letter-spacing:-.4px}
  .hero p{margin:9px 0 0;color:var(--muted);font-size:16px}

  /* ---- البطاقات ---- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);
    gap:18px;margin-bottom:24px}
  @media (max-width:1080px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  .stat{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
    border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:24px 22px;
    overflow:hidden;transition:.3s;display:flex;flex-direction:column;align-items:center;text-align:center}
  .stat:hover{transform:translateY(-3px);border-color:rgba(217,164,0,.3);
    box-shadow:0 10px 30px rgba(0,0,0,.22)}
  .stat .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;
    justify-content:center;margin:0 auto 18px;flex-shrink:0;
    background:rgba(217,164,0,.11);border:1px solid rgba(217,164,0,.22)}
  .stat{display:flex;flex-direction:column;align-items:flex-start}
  .stat .ico i,.stat .ico svg{width:21px;height:21px;color:var(--teal-l);stroke-width:1.75}
  .stat .num{font-size:46px;font-weight:700;line-height:1.05;color:#fff;letter-spacing:-1px;
    width:100%;text-align:center}
  .stat .lbl{font-size:14px;color:var(--muted);margin-top:10px;line-height:1.6;
    width:100%;text-align:center}
  /* الخط الزمني */

  /* تغطية الإرشاد */
  @media (max-width:760px){
  }


  .stat.live{border-color:var(--teal);background:linear-gradient(160deg,rgba(217,164,0,.19),rgba(217,164,0,.06))}
  .stat.live .num{color:var(--teal-l)}
  .stat.live .ico{background:rgba(217,164,0,.2);border-color:rgba(217,164,0,.42)}

  .stat.warn{border-color:rgba(217,164,0,.5)}
  .stat.warn .num{color:#F7C30D}
  .stat.warn .ico{background:rgba(217,164,0,.13);border-color:rgba(217,164,0,.28)}
  .stat.warn .ico i,.stat.warn .ico svg{color:#F7C30D}

  /* ---- الأقسام ---- */
  .sec{margin-top:42px}
  .sec h2{font-size:21px;font-weight:700;margin:0 0 18px;display:flex;align-items:center}
  .sec h2 i,.sec h2 svg{width:20px;height:20px;color:var(--teal);
    margin-left:11px;margin-inline-end:11px;stroke-width:1.75}

  .panel{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.11);
    border-radius:20px;padding:8px 22px 14px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
  th{color:var(--muted);font-weight:600;padding:15px 14px;text-align:right;
    border-bottom:1px solid rgba(255,255,255,.13);font-size:13.5px;
    letter-spacing:.3px;white-space:nowrap}
  td{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,.055)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(255,255,255,.028)}

  .bar{height:9px;background:rgba(255,255,255,.09);border-radius:6px;
    overflow:hidden;margin-top:9px;min-width:110px}
  .bar>i{display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,var(--teal),var(--teal-l));transition:width .9s ease}

  .pill{display:inline-block;padding:5px 13px;border-radius:8px;
    font-size:12.5px;font-weight:600}
  .pill.on{background:rgba(217,164,0,.17);color:var(--teal-l)}
  .pill.off{background:rgba(255,255,255,.08);color:var(--muted)}
  .pill.now{background:rgba(217,164,0,.2);color:#F7C30D}

  .foot{text-align:center;color:#5F7A96;font-size:13px;margin-top:42px;
    padding-top:22px;border-top:1px solid rgba(255,255,255,.08)}
  .foot .t{color:var(--muted);font-weight:600}

  @media (max-width:820px){
    .wrap{padding:20px 16px 34px}
    .hero{gap:16px} .hero .mark{width:74px;height:74px;border-radius:17px}
    .hero h1{font-size:27px} .hero p{font-size:14px}
    .orgs img{height:32px} .orgs .sep{margin:0 12px}
    .stat .num{font-size:40px} .stat{padding:20px 18px}
    .live{font-size:12.5px;padding:7px 14px}
  }
  @media (prefers-reduced-motion:reduce){
    .hero .mark,.dot,.stat.live .ico{animation:none}
  }
  /* الشعاران على الخلفية الداكنة بلون أبيض موحّد */
  .orgs img{filter:brightness(0) invert(1); opacity:.92}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="orgs">
      <img src="./chair-logo.png" alt="كرسي الشيخ عبدالله بن صالح الراشد الحميد">
      <div class="sep"></div>
      <img src="./qassim-logo.png" alt="جامعة القصيم">
    </div>
    <div class="live"><span class="dot"></span>تحديث مباشر</div>
  </div>

  <div class="hero">
    <div class="mark"><img src="./seera-mark.svg" alt="هاكثون السيرة النبوية"></div>
    <div>
      <h1>لوحة الإرشاد</h1>
      <p>متابعة لحظية لجلسات الإرشاد وتغطية الفرق</p>
    </div>
  </div>

  <div id="content">
    <p style="text-align:center;color:var(--muted);padding:60px 0">جارٍ التحميل...</p>
  </div>

  <div class="foot">
    <div class="t">هاكثون السيرة النبوية</div>
    جامعة القصيم — كرسي الشيخ عبدالله بن صالح الراشد الحميد لخدمة السيرة النبوية
    <div id="stamp" style="margin-top:9px"></div>
  </div>
</div>

<script>
const sb = supabase.createClient(window.SEERA_CONFIG.SUPABASE_URL, window.SEERA_CONFIG.SUPABASE_ANON_KEY);

function esc(str){
  if(str == null) return "";
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function jsArg(v){
  return JSON.stringify(v === undefined ? null : v).replace(/[&'<>]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4,"0"));
}

/* ---------------- الخط الزمني ---------------- */
// توزيع مواعيد اليوم على الساعات: يكشف الذروة والفجوات بنظرة.



/* ---------------- الفرق بلا إرشاد ---------------- */
// تكشف من يفوته الإرشاد بينما يمكن تداركه.


const stat = (icon, num, lbl, cls) => `
  <div class="stat ${cls||""}">
    <div class="ico"><i data-lucide="${icon}"></i></div>
    <div class="num">${num ?? "—"}</div>
    <div class="lbl">${lbl}</div>
  </div>`;

// الإدارة ترى قسمين إضافيين. العروض العامة بلا أسماء أصلًا،
// فلا تكشف شيئًا حتى لو قُرئت مباشرة.
let isAdmin = false;

async function checkAdmin(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) return false;
  const { data } = await sb.from("user_roles")
    .select("roles(key)").eq("user_id", session.user.id);
  return (data || []).some(r => ["admin","coordinator"].includes(r.roles?.key));
}

async function render(){
  const box = document.getElementById("content");

  const [sum, tracks] = await Promise.all([
    sb.from("mentorship_live_summary").select("*").maybeSingle(),
    sb.from("mentorship_by_track").select("*")
  ]);

  if(sum.error){
    // اللوحة تتطلب تسجيل الدخول (حساب الإدارة أو المنظّم أو أي حساب في المنصة)
    const { data: { session } } = await sb.auth.getSession();
    box.innerHTML = session
      ? `<p style="text-align:center;color:var(--muted);padding:50px 0">تعذّر تحميل البيانات</p>`
      : `<p style="text-align:center;color:var(--muted);padding:50px 0">يُرجى تسجيل الدخول أولًا من
           <a href="./admin.html" style="color:var(--gold)">لوحة التحكم</a> أو
           <a href="./facilitator.html" style="color:var(--gold)">لوحة المنظّم</a> على هذا الجهاز، ثم تحديث الصفحة.</p>`;
    return;
  }

  const s = sum.data || {};
  const cover = s.إجمالي_الفرق
    ? Math.round((s.فرق_استفادت || 0) / s.إجمالي_الفرق * 100) : 0;
  const noMentors = s.الإرشاد_جارٍ && !s.المرشدون_الحاضرون;

  let html = `
    <div class="grid">
      ${stat("user-check", s.المرشدون_الحاضرون,
             `حاضر من <bdi>${s.إجمالي_المرشدين ?? 0}</bdi> مرشدًا`,
             noMentors ? "warn" : "")}
      ${stat("calendar-days", s.جلسات_اليوم, "جلسة اليوم")}
      ${stat("radio", s.جلسات_جارية, "جارية الآن", s.جلسات_جارية > 0 ? "live" : "")}
      ${stat("clock", s.مواعيد_متاحة, "موعد متاح للحجز")}
      ${stat("circle-check", s.جلسات_منتهية, "جلسة مكتملة")}
      ${stat("users", s.فرق_استفادت, `استفاد من <bdi>${s.إجمالي_الفرق ?? 0}</bdi> فريقًا`)}
      ${stat("star", s.متوسط_التقييم ?? "—", "متوسط تقييم الجلسات")}
      ${stat("chart-pie", cover + "%", "تغطية الفرق بالإرشاد")}
    </div>`;

  const tr = tracks.data || [];
  if(tr.length){
    html += `<div class="sec"><h2><i data-lucide="layout-grid"></i>التوزيع على المسارات</h2><div class="panel">
      <table><thead><tr>
        <th>المسار</th><th>الفرق</th><th>الجلسات</th><th>التغطية</th>
      </tr></thead><tbody>
      ${tr.map(t => {
        const p = t.الفرق ? Math.round((t.فرق_استفادت || 0) / t.الفرق * 100) : 0;
        return `<tr>
          <td style="font-weight:600">${esc(t.المسار)}</td>
          <td><bdi>${t.الفرق ?? 0}</bdi></td>
          <td><bdi>${t.الجلسات ?? 0}</bdi></td>
          <td><bdi>${p}</bdi>%<div class="bar"><i style="width:${p}%"></i></div></td>
        </tr>`;
      }).join("")}
      </tbody></table></div></div>`;
  }

  if(isAdmin) html += await adminSections();

  box.innerHTML = html;

  if(window.lucide) lucide.createIcons();
  document.getElementById("stamp").textContent =
    "آخر تحديث " +
    new Date().toLocaleTimeString("ar-SA-u-nu-latn", {hour:"2-digit", minute:"2-digit"}) +
    " · يُحدَّث كل 30 ثانية";
}

async function adminSections(){
  const [mentors, upcoming] = await Promise.all([
    sb.from("mentorship_admin_detail").select("*").order("المرشد"),
    sb.from("mentorship_upcoming").select("*")
  ]);

  let out = "";
  const m = mentors.data || [];
  if(m.length){
    out += `<div class="sec"><h2><i data-lucide="users-round"></i>المرشدون</h2><div class="panel">
      <table><thead><tr>
        <th>المرشد</th><th>الحضور</th><th>متاحة</th><th>محجوزة</th>
        <th>منتهية</th><th>التقييم</th>
      </tr></thead><tbody>
      ${m.map(x => `<tr>
        <td style="font-weight:600">${esc(x.المرشد)}
          <div style="color:var(--muted);font-size:12.5px;font-weight:400;margin-top:3px">
            ${esc(x.التخصص || "")}</div></td>
        <td><span class="pill ${x.حاضر_اليوم ? "on" : "off"}">
          ${x.حاضر_اليوم ? "حاضر" : "غير مسجَّل"}</span></td>
        <td><bdi>${x.متاحة_الآن ?? 0}</bdi></td>
        <td><bdi>${x.محجوزة ?? 0}</bdi></td>
        <td><bdi>${x.منتهية ?? 0}</bdi></td>
        <td>${x.متوسط_التقييم ? `<bdi>${x.متوسط_التقييم}</bdi>` : "—"}</td>
      </tr>`).join("")}
      </tbody></table></div></div>`;
  }

  const u = upcoming.data || [];
  if(u.length){
    out += `<div class="sec"><h2><i data-lucide="calendar-clock"></i>الجلسات القادمة</h2><div class="panel">
      <table><thead><tr>
        <th>الوقت</th><th>المرشد</th><th>الفريق</th><th>المسار</th><th>الحالة</th>
      </tr></thead><tbody>
      ${u.slice(0, 20).map(x => `<tr>
        <td><bdi>${new Date(x.start_time).toLocaleTimeString("ar-SA-u-nu-latn",
          {hour:"2-digit",minute:"2-digit"})}</bdi></td>
        <td>${esc(x.المرشد || "—")}</td>
        <td style="font-weight:600">${esc(x.الفريق || "—")}</td>
        <td>${esc(x.المسار || "—")}</td>
        <td><span class="pill ${x.الحالة === "جارية" ? "now" : "off"}">
          ${esc(x.الحالة)}</span></td>
      </tr>`).join("")}
      </tbody></table></div></div>`;
  }
  return out;
}

(async () => {
  isAdmin = await checkAdmin();
  await render();
  setInterval(render, 30000);
})();
</script>
</body>
</html>
